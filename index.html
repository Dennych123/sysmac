mple.xml:\n    // <InOutVariables> di depan, sisi keluarnya ke DataSink dengan variabel yang SAMA,\n    // dan pin yang tidak dipakai tidak ditulis sama sekali.\n    P1(\"Inc - InOut lewat <InOutVariables>, ENO ke rel\", function(r){\n        var e=r.ct(\"PRB_TRIG\", r.rail());\n        var b=r.blk(\"Inc\",null,[[\"EN\",e]],[\"ENO\"],[[\"InOut\",r.src(\"PRB_A\")]]);\n        r.sink(\"PRB_A\", b.InOut);\n        r.rr([b.ENO]);\n    });\n    // Persis pola Function0: ENO tidak ditulis, yang menyambung ke rel kanan justru pin\n    // nilai balik tanpa nama.\n    P1(\"Inc - tanpa ENO, pin tanpa nama yang ke rel\", function(r){\n        var e=r.ct(\"PRB_TRIG\", r.rail());\n        var b=r.blk(\"Inc\",null,[[\"EN\",e]],[\"\"],[[\"InOut\",r.src(\"PRB_A\")]]);\n        r.sink(\"PRB_A\", b.InOut);\n        r.rr([b[\"\"]]);\n    });\n    // Ketiga pin keluar ditulis semua dan dua-duanya ada yang memakai.\n    P1(\"Inc - ENO ke rel + nilai balik ke coil\", function(r){\n        var e=r.ct(\"PRB_TRIG\", r.rail());\n        var b=r.blk(\"Inc\",null,[[\"EN\",e]],[\"ENO\",\"\"],[[\"InOut\",r.src(\"PRB_A\")]]);\n        r.sink(\"PRB_A\", b.InOut);\n        r.cl(\"PRB_LAMP\", b[\"\"]);\n        r.rr([b.ENO]);\n    });\n\n    // ---- aritmatika: punya ENO, TAPI pin hasilnya tanpa nama ----\n    P1(\"+ (simbol) - EN,In1,In2 -> ENO + hasil tanpa nama\", function(r){\n        var e=r.ct(\"PRB_TRIG\", r.rail());\n        var b=r.blk(\"+\",null,[[\"EN\",e],[\"In1\",r.src(\"PRB_A\")],[\"In2\",r.src(\"UDINT#1\")]],[\"ENO\",\"\"]);\n        r.sink(\"PRB_B\", b[\"\"]);\n        r.rr([b.ENO]);\n    });\n    P1(\"ADD (kata) - EN,In1,In2 -> ENO,Out\", function(r){\n        var e=r.ct(\"PRB_TRIG\", r.rail());\n        var b=r.blk(\"ADD\",null,[[\"EN\",e],[\"In1\",r.src(\"PRB_A\")],[\"In2\",r.src(\"UDINT#1\")]],[\"ENO\",\"Out\"]);\n        r.sink(\"PRB_B\", b.Out);\n        r.rr([b.ENO]);\n    });\n\n    return { name:\"_Probe_Instructions.xml\", xml:prog(\"P999_Probe\",ext,priv,[sect(\"Probe\",1,S)],glob),\n             stats:\"PROBE ronde 2: \"+S.length+\" varian (MOVE, pembanding, Get**Clk, Inc, ADD) - import ke \"\n                  +\"project KOSONG, catat nomor V yang TIDAK bertanda (DefinitionError) / (Import failed)\" };\n}\n\n\n// ============================================================ P000_Initial\n// Bit rangka yang dipakai SELURUH program: GSB000 selalu ON, GSB001 selalu OFF, lalu deretan\n// coil cadangan. Sebelum ini generator memakai GSB000 di puluhan rung sebagai penanda tapi tidak\n// pernah membuatnya - hasil generate di-import ke project kosong, bitnya tidak ada, dan semua\n// rung penanda itu mati tanpa ada yang protes. Program ini yang menutup lubang itu.\n//\n// Isinya nol machine-specific: sama persis untuk mesin apa pun.\nvar GSB_DESIGN_LAST = 9;    // GSB002..GSB009 cadangan desain\nvar GSB_ADJUST_LAST = 25;   // GSB010..GSB025 cadangan penyetelan\nfunction buildInitial(){\n    var ext=[],priv=[],glob=[],nameCI={};\n    function G(n,t,d){ var k=n.toUpperCase(); if(nameCI[k]) return; nameCI[k]=n; var v=vr(n,t,d); glob.push(\"      \"+v); ext.push(\"      \"+v); GLOBALS[n]={t:t||\"BOOL\",d:d||\"\"}; }\n\n    // 1. Design_Coil\n    var S1=[], o=1;\n    G(\"GSB000\",\"BOOL\",\"Equipment design coil, constant ON\");\n    G(\"GSB001\",\"BOOL\",\"Equipment design coil, constant OFF\");\n    // P_On / P_Off itu system variable Susmax - selalu ada, tidak perlu dideklarasi ulang.\n    S1.push(series(o++,[[\"P_On\",false]],\"GSB000\",\"Bits held permanently on and off by design\"));\n    S1.push(series(o++,[[\"P_Off\",false]],\"GSB001\",null));\n    for(var d=2; d<=GSB_DESIGN_LAST; d++){\n        var gd=\"GSB\"+pad(d,3);\n        G(gd,\"BOOL\",\"For machine design, spare \"+(d-1));\n        S1.push(series(o++,[[\"GSB001\",false]],gd, d===2?\"Design spare coils\":null));\n    }\n    // Clock pulse. Get**Clk itu instruksi, bukan kontak. Bentuknya: EN masuk, SATU pin keluar\n    // TANPA NAMA - keluarga ini tidak punya ENO sama sekali (docs/SYSMAC_INSTRUCTIONS.md).\n    // Minta \"ENO\" di sini persis yang bikin Studio menjawab (DefinitionError)Get1sClk.\n    var clocks=[[\"aP_1s\",\"Get1sClk\",\"1 second clock pulse\"],\n                [\"aP_0_1s\",\"Get100msClk\",\"0.1 second clock pulse\"],\n                [\"aP_0_01s\",\"Get10msClk\",\"0.01 second clock pulse\"]];\n    clocks.forEach(function(c,i){\n        G(c[0],\"BOOL\",c[2]);\n        if(ADV_OK){\n            var r=new Rung(o++, i===0?\"Clock pulses\":null);\n            var rail=r.rail();\n            var out=r.blk(c[1],null,[[\"EN\",rail]],[\"\"]);\n            r.rr([r.cl(c[0],out[\"\"])]);\n            S1.push(r.build());\n        } else {\n            S1.push(series(o++,[[\"GSB001\",false]],c[0],\n                i===0?\"Clock pulses need \"+c[1]+\"() - enable advanced instructions to generate them\":null));\n        }\n    });\n\n    // 2. Adjust_Coil\n    var S2=[]; o=1;\n    for(var a=GSB_DESIGN_LAST+1; a<=GSB_ADJUST_LAST; a++){\n        var ga=\"GSB\"+pad(a,3);\n        G(ga,\"BOOL\",\"For machine adjustment, spare \"+(a-GSB_DESIGN_LAST));\n        S2.push(series(o++,[[\"GSB001\",false]],ga, a===GSB_DESIGN_LAST+1?\"Adjustment spare coils\":null));\n    }\n\n    var secs=[sect(\"Design_Coil\",1,S1),sect(\"Adjust_Coil\",2,S2)];\n    return { name:\"P000_Initial.xml\", xml:prog(\"P000_Initial\",ext,priv,secs,glob),\n             stats:\"INITIAL: GSB000/GSB001 + \"+(GSB_ADJUST_LAST-1)+\" spare coil, \"\n                  +(ADV_OK?\"clock pulses generated\":\"clock pulses placeholder\") };\n}\n\n// ============================================================ Prg003_HMI\n// Program khusus antarmuka operator. Isinya bukan logika mesin: dia merangkum bit yang sudah\n// dihitung program lain jadi bentuk yang dibaca panel - lampu status, rangkuman syarat master /\n// auto start, dan (nanti) counter. Dipisah dari MAIN karena tugasnya memang beda: MAIN yang\n// memutuskan mesin boleh jalan atau tidak, program ini cuma MENAMPILKAN kenapa.\nfunction buildHmi(){\n    var ext=[],priv=[],glob=[],nameCI={};\n    function G(n,t,d){ var k=n.toUpperCase(); if(nameCI[k]) return; nameCI[k]=n; var v=vr(n,t,d); glob.push(\"      \"+v); ext.push(\"      \"+v); GLOBALS[n]={t:t||\"BOOL\",d:d||\"\"}; }\n    function P(n,t,d){ var k=n.toUpperCase(); if(nameCI[k]) return; nameCI[k]=n; priv.push(\"      \"+vr(n,t,d)); }\n    G(\"GSB000\",\"BOOL\",\"Equipment design coil, constant ON\");\n    MAIN_EXPORTS.forEach(function(n){ G(n,\"BOOL\",\"Machine status broadcast to all units\"); });\n    COND_ARRAYS.forEach(function(ca){ G(ca.name,\"ARRAY[0..\"+(ca.size-1)+\"] OF BOOL\",ca.doc); });\n\n    // 1. TP_Control\n    var S1=[], o=1, tpBit=6;\n    // Mirror status ke lampu panel. Sengaja lewat simbol PL_TP_* sendiri, bukan langsung memakai\n    // bit statusnya: panel dan ladder jadi bisa berubah sendiri-sendiri tanpa saling menyeret.\n    [[\"MSTR_RDY\",\"PL_TP_MSTR_RDY\",\"Master ready indication\"],\n     [\"AUTO_RUN\",\"PL_TP_AUTO_RUN\",\"Auto running indication\"],\n     [\"HOME_POST\",\"PL_TP_HOME_POS\",\"All machine home indication\"],\n     [\"IND_MODE\",\"PL_TP_IND_MODE\",\"Individual mode indication\"],\n     [\"NO_FAULT\",\"PL_TP_NO_FLT\",\"No fault indication\"]].forEach(function(x,i){\n        G(x[1],\"BOOL\",x[2]);\n        // Lanjut dari bit sisa word lampu MAIN - PL_HMI_* memakai .00-.05, jadi PL_TP_* mulai .06.\n        // Satu word buat semua lampu status, gampang dibaca sekali lihat di NB.\n        hmiClaim(x[1], atBit(HMI_CFG.btnArea,HMI_CFG.lampBase,tpBit++), \"PLC->HMI\", \"001\", x[2]);\n        S1.push(series(o++,[[x[0],false]],x[1], i===0?\"Machine status to touch panel\":null));\n    });\n    // Rangkuman tiap array kondisi: elemen dipecah per COND_CHUNK jadi bit antara, lalu bit-bit\n    // antara itu di-AND jadi satu bit \"semua syarat terpenuhi\". Dipecah karena satu rung dengan\n    // 16 kontak seri tidak terbaca di layar Susmax Studio, dan operator yang mencari syarat mana\n    // yang belum jalan bisa langsung lihat kelompok mana yang mati.\n    var condSummary={};\n    COND_ARRAYS.forEach(function(ca,ai){\n        var parts=[];\n        for(var s=0;s<ca.size;s+=COND_CHUNK){\n            var grp=[];\n            for(var i2=s;i2<Math.min(s+COND_CHUNK,ca.size);i2++) grp.push([ca.name+\"[\"+i2+\"]\",false]);\n            var pb=\"LB\"+pad(1+ai*10+s/COND_CHUNK,3);\n            P(pb,\"BOOL\",ca.doc+\" group \"+(s/COND_CHUNK+1));\n            S1.push(series(o++,grp,pb, s===0?(\"\u00e2\u2013\u00a0 \"+ca.doc):null));\n            parts.push([pb,false]);\n        }\n        var all=\"LB\"+pad(8+ai*10,3);\n        P(all,\"BOOL\",ca.doc+\", all groups established\");\n        S1.push(series(o++,parts,all,null));\n        condSummary[ca.name]=all;\n    });\n    G(\"PL_TP_MSTR_COND\",\"BOOL\",\"Master on condition established indication\");\n    hmiClaim(\"PL_TP_MSTR_COND\", atBit(HMI_CFG.btnArea,HMI_CFG.lampBase,tpBit++), \"PLC->HMI\", \"001\", \"Master on condition established indication\");\n    S1.push(series(o++,[[condSummary.PL21,false],[\"MSTR_RDY\",false]],\"PL_TP_MSTR_COND\",\"Master on condition established\"));\n    G(\"PL_TP_AUTO_COND\",\"BOOL\",\"Auto start condition established indication\");\n    hmiClaim(\"PL_TP_AUTO_COND\", atBit(HMI_CFG.btnArea,HMI_CFG.lampBase,tpBit++), \"PLC->HMI\", \"001\", \"Auto start condition established indication\");\n    S1.push(series(o++,[[condSummary.PL031,false],[condSummary.PL032,false]],\"PL_TP_AUTO_COND\",\"Auto start condition established\"));\n\n    // 2. Counters\n    // Pola counter Denso butuh pembanding (`<`, `<>`, `>=`) dan Inc() - di luar kontak/coil/TON.\n    // Susunan pin-nya sudah pasti (docs/SYSMAC_INSTRUCTIONS.md + `--probe-fb`), yang belum pasti\n    // cuma cara menulis pin tanpa nama di XML import. Karena itu tetap di balik ADV_OK sampai\n    // _Probe_Instructions.xml ter-import bersih: XML yang ditebak masuk tanpa keluhan lalu salah\n    // waktu jalan, dan itu baru ketahuan pas mesinnya bergerak. Lihat TODO.md 5a.\n    var S2=[]; o=1;\n    G(\"GCT\",\"ARRAY[1..\"+CNT_N+\"] OF BOOL\",\"Counter count trigger\");\n    G(\"CNT_ACT\",\"ARRAY[1..\"+CNT_N+\"] OF UDINT\",\"Counter present value\");\n    G(\"CNT_SET\",\"ARRAY[1..\"+CNT_N+\"] OF UDINT\",\"Counter target value\");\n    G(\"CNT_WARN\",\"ARRAY[1..\"+CNT_N+\"] OF UDINT\",\"Counter warning threshold\");\n    CNT_LAMPS.forEach(function(cl,ci){\n        G(cl.name,\"ARRAY[0..\"+(cl.size-1)+\"] OF BOOL\",\"Counter indication, screen \"+cl.screen);\n        hmiClaimRange(cl.name, HMI_CFG.btnArea, HMI_CFG.cntBase+ci, cl.size, \"PLC->HMI\", cl.screen, \"Counter indication\");\n    });\n    if(!ADV_OK){\n        P(\"COUNTER_NOP\",\"BOOL\",\"No operation, reserved for counter circuits\");\n        S2.push(series(o++,[[\"GSB000\",false]],\"COUNTER_NOP\",\n            \"Counter circuits need MOVE / compare / Inc - turn on advanced instructions after the probe file imports cleanly\"));\n        W(\"counters_not_generated\",\"\",\"Prg003_HMI: the Counters section is still a placeholder. Import _Probe_Instructions.xml into Studio first; if it comes in clean, turn on 'Advanced instructions' and the counters get generated for real.\",{level:\"info\"});\n    } else {\n        for(var ci2=0; ci2<CNT_N; ci2++){\n            var slot=cntLamp(ci2);\n            if(!slot){ W(\"counter_lamp_full\",\"\",\"Counter \"+(ci2+1)+\" got no lamp slot, skipped.\"); continue; }\n            var n1=ci2+1, act=\"CNT_ACT[\"+n1+\"]\", set=\"CNT_SET[\"+n1+\"]\", wrn=\"CNT_WARN[\"+n1+\"]\";\n            var lw=slot.arr+\"[\"+slot.warn+\"]\", lu=slot.arr+\"[\"+slot.up+\"]\";\n            // Rantai power-flow murni: kontak -> pembanding -> Inc -> rail. Bentuk pin-nya\n            // BUKAN tebakan, diambil dari project mesin lewat `reader/cli.js --probe-fb`:\n            //   pembanding  EN,In1,In2 -> satu pin TANPA NAMA, TIDAK punya ENO\n            //   Inc         EN,InOut   -> ENO + InOut lagi di sisi keluar\n            // Nama instruksinya pakai simbol (`<`, `<>`, `>=`), sama seperti yang tersimpan di\n            // project nyata; lib.js yang meng-escape `<` jadi &lt; waktu menulis XML.\n            var ZERO=\"UDINT#0\";   // literal bertipe - CNT_ACT itu UDINT, \"0\" telanjang ambigu\n            // 1. hitung naik selama belum sampai target\n            var r1=new Rung(o++, \"Counter \"+n1+\" : count up while below target\");\n            var g1=r1.ct(\"GCT[\"+n1+\"]\", r1.rail());\n            var lt=r1.blk(\"<\",null,[[\"EN\",g1],[\"In1\",r1.src(act)],[\"In2\",r1.src(set)]],[\"\"]);\n            // InOut ditulis sebagai <InOutVariables>, BUKAN didaftar dua kali di Input dan\n            // Output. Bentuk ini disalin dari Function0 di contoh resmi Omron (Sample.xml):\n            // DataSource -> pin in-out -> DataSink dengan variabel YANG SAMA. Mendaftarnya\n            // dua kali bikin Studio melihat 2 masuk + 3 keluar padahal definisinya 1 masuk +\n            // 1 keluar + 1 in-out, dan jawabannya \"The function name is not defined\".\n            // Pin nilai balik yang tidak dipakai TIDAK ditulis - contoh Omron pun tidak\n            // menulis ENO waktu ENO-nya tidak dipakai. Pin yang ditulis wajib ada yang\n            // memakai; kalau tidak: \"invalid connection\" dan rung-nya ter-import kosong.\n            var inc=r1.blk(\"Inc\",null,[[\"EN\",lt[\"\"]]],[\"ENO\"],[[\"InOut\",r1.src(act)]]);\n            r1.sink(act, inc.InOut);\n            r1.rr([inc.ENO]); S2.push(r1.build());\n            // 2. lampu WARNING - padam begitu UP nyala, biar operator gak lihat dua lampu bareng\n            var r2=new Rung(o++, \"Counter \"+n1+\" : warning reached\");\n            var rl2=r2.rail();\n            var ne=r2.blk(\"<>\",null,[[\"EN\",rl2],[\"In1\",r2.src(act)],[\"In2\",r2.src(ZERO)]],[\"\"]);\n            var ge=r2.blk(\">=\",null,[[\"EN\",ne[\"\"]],[\"In1\",r2.src(act)],[\"In2\",r2.src(wrn)]],[\"\"]);\n            r2.rr([r2.cl(lw, r2.ct(lu, ge[\"\"], true))]); S2.push(r2.build());\n            // 3. lampu UP\n            var r3=new Rung(o++, \"Counter \"+n1+\" : target reached\");\n            var rl3=r3.rail();\n            var ne3=r3.blk(\"<>\",null,[[\"EN\",rl3],[\"In1\",r3.src(act)],[\"In2\",r3.src(ZERO)]],[\"\"]);\n            var ge3=r3.blk(\">=\",null,[[\"EN\",ne3[\"\"]],[\"In1\",r3.src(act)],[\"In2\",r3.src(set)]],[\"\"]);\n            r3.rr([r3.cl(lu, ge3[\"\"])]); S2.push(r3.build());\n        }\n    }\n\n    // 3. Setup\n    var S3=[]; o=1;\n    P(\"SETUP_NOP\",\"BOOL\",\"No operation, reserved for setup handling\");\n    S3.push(series(o++,[[\"GSB000\",false]],\"SETUP_NOP\",\"Product setup / recipe handling belongs here\"));\n\n    // 4. Memory\n    var S4=[]; o=1;\n    P(\"MEMORY_NOP\",\"BOOL\",\"No operation, reserved for memory latch\");\n    S4.push(series(o++,[[\"GSB000\",false]],\"MEMORY_NOP\",\"HMI-level memory latches belong here - none generated yet\"));\n\n    var secs=[sect(\"TP_Control\",1,S1),sect(\"Counters\",2,S2),sect(\"Setup\",3,S3),sect(\"Memory\",4,S4)];\n    return { name:\"Prg003_HMI.xml\", xml:prog(\"Prg003_HMI\",ext,priv,secs,glob),\n             stats:\"HMI: \"+COND_ARRAYS.length+\" condition array x\"+COND_ARRAYS[0].size\n                  +\", counters placeholder\" };\n}\n\nif(!groups.MAIN||!groups.MAIN.length) W(\"no_main_devices\",\"\",\"No MAIN devices found, every comment contains a station tag.\");\nfiles.push(buildInitial());\nif(!ADV_OK) files.push(buildProbe());\nfiles.push(buildMain(groups.MAIN||[]));\nfiles.push(buildHmi());\nukeys.forEach(function(k){ files.push(buildUnit(k,groups[k])); });\n\n// Index yang direservasi tapi belum kepakai (blok MAIN dan blok tiap station) tetap diisi komen \"Spare\"\n// biar keliatan di tabel Global Variable itu slot cadangan, bukan ketinggalan/hilang\n(function fillSpareArrayComments(){\n    // Tiap slot kosong dikasih stub nama ber-nomor (AL069_, MF007_) di depan keterangannya. Gunanya\n    // biar pas dipakai nanti tinggal dilengkapin jadi nama beneran (AL069_PRESS_NG) - dan yang lebih\n    // penting, slot yang gak kepakai jadi PUNYA baris di TSV. Sebelum ini ekor array di luar blok\n    // MAIN/station gak dikomen sama sekali, jadi elemennya gak ke-emit dan di Susmax Studio\n    // kelihatan kosong melompong - gak kebedain antara \"cadangan\" dan \"kelewat\".\n    // Komennya sengaja PENDEK: cuma stub bernomor + kata \"Spare\". Versi panjang dulu (\"Spare, reserved\n    // for ST1 alarm group\") kebaca ratusan kali di tabel dan malah bikin baris yang beneran penting\n    // tenggelam. Station pemiliknya gak hilang informasinya - itu kebaca dari nomornya sendiri lewat\n    // peta blok yang dicetak di stats, dan blok tiap station sekarang tetap (gak geser-geser lagi).\n    function fillRange(fn,prefix,start,end){\n        for(var n=start;n<=end;n++){\n            var t=fn(n);\n            if(!ARRAY_ELEMENTS[t]) ARRAY_ELEMENTS[t]=prefix+pad(n,3)+\"_ Spare\";\n        }\n    }\n    fillRange(AL,\"AL\",1,AL_SIZE);\n    fillRange(MF,\"MF\",1,MF_SIZE);\n})();\n\n// AL/MF di-AT ke area W supaya Alarm Display dan Event Display di NB bisa baca blok bit-nya\n// langsung, tanpa rung penyalin. AT dipasang di variabel ARRAY-nya - elemen array gak bisa di-AT\n// satu-satu - jadi AL[1] jatuh di bit .00 word base, AL[17] di .00 word base+1, dan seterusnya.\nhmiClaimRange(\"AL\", HMI_CFG.alArea, HMI_CFG.alBase, AL_SIZE, \"PLC->HMI\", \"005/0091\", \"AL[1..\"+AL_SIZE+\"]\");\nhmiClaimRange(\"MF\", HMI_CFG.mfArea, HMI_CFG.mfBase, MF_SIZE, \"PLC->HMI\", \"005/0091\", \"MF[1..\"+MF_SIZE+\"]\");\n\nvar gnames=Object.keys(GLOBALS).sort();\nvar elNames=Object.keys(ARRAY_ELEMENTS).sort(function(a,b){\n    var ma=a.match(/^(\\D+)\\[(\\d+)\\]$/), mb=b.match(/^(\\D+)\\[(\\d+)\\]$/);\n    return ma[1]===mb[1] ? (ma[2]-mb[2]) : ma[1]<mb[1]?-1:1;\n});\n// baris array-level (AL, MF) buat paste awal ke tabel Global Variable, baris per elemen (AL[61], ...) buat isi Comment\n// setelah array di-expand di Susmax Studio - lihat README bagian import\nvar TSV_HEAD=\"Name\\tData type\\tInitial value\\tAT\\tRetain\\tConstant\\tNetwork Publish\\tComment\";\nfunction tsvRow(n,t,at,cmt){ return [n,t,\"\",at||\"\",\"False\",\"False\",\"Do not publish\",cmt||\"\"].join(\"\\t\"); }\nvar tsv=TSV_HEAD+\"\\n\"\n      + gnames.map(function(n){ var g=GLOBALS[n]; return tsvRow(n,g.t,HMI_AT[n],g.d); }).join(\"\\n\")\n      + (elNames.length ? \"\\n\" + elNames.map(function(n){ return tsvRow(n,\"BOOL\",\"\",ARRAY_ELEMENTS[n]); }).join(\"\\n\") : \"\");\n\n// File TERPISAH khusus elemen array. Di tabel Global Variable Sysmac, komen elemen baru bisa diisi\n// SETELAH array-nya di-expand, dan waktu itu yang kelihatan cuma blok AL[1..n]/MF[1..n] berurutan.\n// Kalau yang ditempel file gabungan, ratusan baris variabel skalar ikut kebawa dan barisnya gak\n// sejajar sama blok yang lagi kebuka. Makanya elemen dipisah, urutannya persis urutan expand.\nvar elemTsv = TSV_HEAD+\"\\n\" + elNames.map(function(n){ return tsvRow(n,\"BOOL\",\"\",ARRAY_ELEMENTS[n]); }).join(\"\\n\");\n// Baris yang sama dalam bentuk terstruktur, buat panel spreadsheet di web UI\nvar ARRAY_ROWS = elNames.map(function(n){\n    var m=/^(\\D+)\\[(\\d+)\\]$/.exec(n);\n    return { arr:m?m[1]:n, idx:m?parseInt(m[2],10):0, name:n, komen:ARRAY_ELEMENTS[n] };\n});\n// Peta blok dicetak di stats, bukan diulang-ulang di tiap komen spare: satu baris ini nggantiin\n// ratusan \"reserved for ST1 alarm group\" dan lebih gampang dibaca sekali lihat.\nvar blockMap = \"MAIN AL[1..\"+AL_MAIN_RESERVED+\"]  |  \" + ukeys.map(function(k){\n    return k+\" AL[\"+AL_BLOCK[k].start+\"..\"+AL_BLOCK[k].end+\"] MF[\"+MF_BLOCK[k].start+\"..\"+MF_BLOCK[k].end+\"]\";\n}).join(\"  |  \");\nfiles.push({ name:\"ArrayComments.tsv\", xml:elemTsv,\n             stats:\"ARRAY COMMENT: \"+elNames.length+\" element (AL+MF), buat paste ke tabel yang arraynya sudah di-expand\" });\nHMI_ROWS.sort(function(a,b){ return a.at<b.at?-1:a.at>b.at?1:0; });\nfiles.push({ name:\"GlobalVariables.tsv\", xml:tsv,\n             stats:\"GLOBAL: \"+gnames.length+\" variable, \"+elNames.length+\" array element comment\"\n                  +\"\\nARRAY BLOCK (\"+STATION_BLOCK+\" slot/station): \"+blockMap\n                  +(HMI_CFG.on ? \"\\nHMI AT: \"+HMI_ROWS.length+\" symbol mapped, buttons \"+HMI_CFG.btnArea+HMI_CFG.pbBase\n                                 +\"+, lamps +\"+HMI_CFG.rdOfs+\", AL \"+HMI_CFG.alArea+HMI_CFG.alBase+\", MF \"+HMI_CFG.mfArea+HMI_CFG.mfBase\n                                 +\", \"+PER_PAGE+\" actuators/screen, \"+HMI_CFG.stride+\" word/station\"\n                               : \"\\nHMI AT: disabled\") });\n\nvar globVars=gnames.map(function(n){ return \"      \"+vr(n,GLOBALS[n].t,GLOBALS[n].d); });\n// Probe SENGAJA tidak ikut ke AllPrograms.xml. Dia alat uji buat project KOSONG; kalau ikut\n// masuk file gabungan, program uji itu ikut ke-import ke project mesin.\nvar blocks=files.filter(function(f){ return f.name.slice(-4)===\".xml\" && f.name.indexOf(\"_Probe\")!==0; })\n                .map(function(f){ return extractProgram(f.xml); }).filter(Boolean);\nfiles.unshift({ name:\"AllPrograms.xml\", xml:progMulti(\"AllPrograms\",blocks,globVars),\n                stats:\"COMBINED: \"+blocks.length+\" program and \"+gnames.length+\" global variable in one file\" });\n\nmsg.payload={ files:files, warnings:warnings.join(\"\\n\"), warnList:warnList, unitCount:ukeys.length,\n              stats:files.map(function(f){return f.stats;}).join(\"\\n\"),\n              // Dipakai web UI buat nampilin rekomendasi ukuran array (minimal = yang kepakai sekarang)\n              arrayInfo:{ alUsed:AL_USED, mfUsed:MF_USED, alSize:AL_SIZE, mfSize:MF_SIZE,\n                          alFilled:AL_FILLED, mfFilled:MF_FILLED, stationBlock:STATION_BLOCK },\n              // Peta alamat HMI buat panel \"HMI\" di web UI dan buat generator screen NB-Designer\n              hmiMap:{ cfg:HMI_CFG, rows:HMI_ROWS },\n              // Elemen AL/MF buat panel spreadsheet - dipakai buat nyalin kolom Comment ke Sysmac\n              arrayRows:ARRAY_ROWS,\n              lscAudit:lscAudit.join(\"\\n\") };\nreturn msg;\n";

function runNode(code, msg, flowStore) {
  var flow = { get: function(k){ return flowStore[k]; }, set: function(k,v){ flowStore[k]=v; } };
  var node = { warn: function(m){ console.warn(m); } };
  return new Function('msg','flow','node','return (function(){'+code+'})()')(msg, flow, node);
}


// ===== Clipboard + file, buat toolbar Import/Export JSON =====
// Tool ini dipakai offline lewat file:// . Chrome ngitung file:// sebagai secure context jadi
// navigator.clipboard biasanya jalan, TAPI browser lain / kebijakan kantor bisa nolak, dan
// readText() masih bisa ditolak user lewat prompt izin. Jadi tiap jalur clipboard WAJIB punya
// fallback yang jelas - jangan sampai tombolnya diem tanpa kabar dan user ngira datanya kesalin.
function copyTextToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
  return new Promise(function (resolve, reject) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) resolve(); else reject(new Error('browser nolak perintah copy'));
    } catch (e) { reject(e); }
  });
}

function readTextFromClipboard() {
  if (navigator.clipboard && navigator.clipboard.readText) return navigator.clipboard.readText();
  return Promise.reject(new Error('browser ini gak ngizinin baca clipboard'));
}

function pickTextFile() {
  return new Promise(function (resolve, reject) {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json,text/plain';
    inp.style.display = 'none';
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0];
      if (!f) { reject(new Error('gak ada file kepilih')); return; }
      var fr = new FileReader();
      fr.onload = function () { resolve({ name: f.name, text: String(fr.result) }); };
      fr.onerror = function () { reject(new Error('gagal baca file ' + f.name)); };
      fr.readAsText(f);
    });
    document.body.appendChild(inp); inp.click(); document.body.removeChild(inp);
  });
}

// Bikin baris tombol Import/Export standar buat satu kotak JSON.
//   ta       : textarea-nya (tetap jadi permukaan edit manual - jalur offline utama)
//   msg      : elemen buat nampilin status
//   getText  : () -> string JSON yang mau diekspor
//   doImport : (text) -> string error, atau null kalau sukses (sekalian ngurus render ulang)
//   fileName : nama default file download
function buildJsonIORow(ta, msg, getText, doImport, fileName) {
  var row = document.createElement('div'); row.className = 'row';
  function say(cls, t) { msg.className = 'json-msg' + (cls ? ' ' + cls : ''); msg.textContent = t; }
  function runImport(text, src) {
    ta.value = text;
    var e = doImport(text);
    if (e) say('err', e); else say('ok', 'Loaded from' + ' ' + src);
  }
  function btn(cls, label, fn) {
    var b = document.createElement('button'); b.className = cls; b.textContent = label;
    b.addEventListener('click', fn); row.appendChild(b); return b;
  }

  btn('json-import', 'Load from box', function () { runImport(ta.value, 'the box'); });
  btn('json-alt', 'Open file', function () {
    pickTextFile().then(function (f) { runImport(f.text, f.name); })
                  .catch(function (e) { say('err', 'Failed:' + ' ' + e.message); });
  });
  btn('json-alt', 'Paste', function () {
    readTextFromClipboard().then(function (txt) {
      if (!txt || !txt.trim()) { say('err', 'Clipboard is empty'); return; }
      runImport(txt, 'clipboard');
    }).catch(function (e) {
      say('err', 'Cannot read clipboard, paste into the box then press Load from box' + ' (' + e.message + ')');
    });
  });

  var sep = document.createElement('div'); sep.className = 'row-sep'; row.appendChild(sep);

  // Variabel lokalnya JANGAN dinamai t: itu nama fungsi terjemahan, dan begitu ketutup
  // 'Copied to clipboard' malah memanggil string hasil export. Handler-nya mati diam-diam.
  btn('json-export', 'Copy', function () {
    var json = getText(); ta.value = json;
    copyTextToClipboard(json).then(function () { say('ok', 'Copied to clipboard'); })
      .catch(function (e) { say('err', 'Copy failed, the JSON is in the box - copy it by hand' + ' (' + e.message + ')'); });
  });
  btn('json-export', 'Save file', function () {
    var json = getText(); ta.value = json;
    downloadFile(fileName, json); say('ok', 'Saved:' + ' ' + fileName);
  });

  return row;
}

// ===== Editor IO list mode tabel =====
// Textarea TSV tetap jadi SUMBER KEBENARAN - seluruh pipeline, Project JSON, dan import/export
// membacanya. Tabel ini murni permukaan edit yang baca-tulis teks yang sama, jadi gak ada satu pun
// jalur lama yang perlu diubah dan tempel-massal dari Excel tetap jalan lewat mode Teks.
// Daftar jenis diambil dari PRE di genname.js - kalau ada jenis baru di sana, tambahin di sini juga.
var IO_JENIS = [
  ['PB', 'Push button'], ['SS', 'Selector switch'], ['LS', 'Limit switch'],
  ['CR', 'Relay / contactor'], ['PH', 'Photo sensor'], ['PX', 'Proximity sensor'],
  ['AS', 'Auto switch silinder (dipasangkan 2 arah)'], ['SRV_LS', 'Feedback posisi servo'],
  ['PL', 'Pilot lamp'], ['BZ', 'Buzzer'], ['2P', 'Tombol 2 tangan'],
  ['SOL', 'Solenoid valve'], ['SRV_CMD', 'Command servo (N posisi)']
];
var IO_IN_ONLY = { PB:1, SS:1, LS:1, PH:1, PX:1, AS:1, SRV_LS:1, '2P':1 };
var IO_OUT_ONLY = { PL:1, BZ:1, SOL:1, SRV_CMD:1 };   // CR bisa dua-duanya

var ioRows = [];        // [{address,jenis,io,komen}]
var ioView = 'grid';

// Pemisah baris dibikin lewat new RegExp dari string, bukan regex literal. Alasannya: HTML di
// build_html.py itu string Python biasa, jadi escape baris-baru yang ditulis tunggal bakal ditelan
// Python duluan dan regex literal-nya rusak. Di dalam string, escape-nya ditulis dobel dan aman.
var IO_LINE_RE = new RegExp('[\r\n]+');

function ioParseText(txt) {
  return String(txt || '').split(IO_LINE_RE).filter(function (l) { return l.trim() !== ''; })
    .map(function (l) {
      var c = l.split('\t');
      return { address: (c[0] || '').trim(), jenis: (c[1] || '').trim().toUpperCase(),
               io: (c[2] || '').trim().toUpperCase(), komen: (c[3] || '').trim() };
    });
}
function ioRowsToText(rows) {
  return rows.map(function (r) { return [r.address, r.jenis, r.io, r.komen].join('\t'); }).join('\n');
}
// Station diturunkan dari komen persis seperti split.js, biar yang kelihatan di tabel = yang bakal
// kejadian pas generate, bukan tebakan terpisah yang bisa beda.
function ioStationOf(komen) {
  var m = /\bST\s*(\d+)/i.exec(String(komen || ''));
  return m ? 'ST' + m[1] : 'MAIN';
}

// SATU-SATUNYA cara yang benar buat ngeset IO list dari kode. Nulis langsung ke textarea gak cukup:
// mode Tabel itu tampilan default, dan dia baca dari ioRows - kalau gak di-reload, pipeline jalan
// pakai teks baru (aktuator muncul) tapi tabelnya masih nampilin isi lama. Persis itu yang kejadian
// waktu import Project JSON.
function setIoText(text) {
  var ta = document.getElementById('ioText');
  if (ta) ta.value = String(text || '');
  ioLoadFromText();
  renderIoGrid();
}

function ioSyncToText() {
  var ta = document.getElementById('ioText');
  if (ta) ta.value = ioRowsToText(ioRows);
}
function ioLoadFromText() {
  var ta = document.getElementById('ioText');
  ioRows = ioParseText(ta ? ta.value : '');
}

// Masalah yang dicek SAMA dengan validate.js - tujuannya user lihat errornya di baris yang salah,
// sebelum klik Generate, bukan sebagai satu blok teks sesudahnya.
function ioProblems() {
  var bad = {}, seen = {}, dup = {};
  ioRows.forEach(function (r, i) {
    var miss = !r.address || !r.jenis || !r.io;
    if (miss) bad[i] = 'Address, Type and IN/OUT are required';
    if (r.address && r.io) {
      var k = r.io + '|' + r.address;
      if (seen[k] !== undefined) { dup[k] = true; bad[i] = 'Alamat ' + r.address + ' (' + r.io + ') dipakai lebih dari sekali'; bad[seen[k]] = bad[seen[k]] || ('Alamat ' + r.address + ' (' + r.io + ') dipakai lebih dari sekali'); }
      else seen[k] = i;
    }
  });
  return bad;
}

function renderIoGrid() {
  var tb = document.querySelector('#ioGrid tbody');
  if (!tb) return;
  var bad = ioProblems();
  tb.innerHTML = '';

  var thead = document.querySelector('#ioGrid thead');
  if (!thead) {
    thead = document.createElement('thead');
    var hr = document.createElement('tr');
    ['#', 'Address', 'Type', 'IN/OUT', 'Comment', 'Program', ''].forEach(function (h) {
      var th = document.createElement('th'); th.textContent = h; hr.appendChild(th);
    });
    thead.appendChild(hr);
    document.getElementById('ioGrid').insertBefore(thead, tb);
  }

  ioRows.forEach(function (r, i) {
    var rowEl = document.createElement('tr');
    if (bad[i]) { rowEl.className = 'bad'; rowEl.title = bad[i]; }

    var tdN = document.createElement('td'); tdN.className = 'rn'; tdN.textContent = (i + 1); rowEl.appendChild(tdN);

    function cell(cls) { var td = document.createElement('td'); td.className = cls; rowEl.appendChild(td); return td; }
    function commit() { ioSyncToText(); renderIoGrid(); ioUpdateCount(); }

    var addr = document.createElement('input');
    addr.value = r.address; addr.placeholder = 'CH0_00';
    addr.addEventListener('change', function () { r.address = addr.value.trim(); commit(); });
    cell('c-addr').appendChild(addr);

    var sel = document.createElement('select');
    var blank = document.createElement('option'); blank.value = ''; blank.textContent = '- pick -'; sel.appendChild(blank);
    IO_JENIS.forEach(function (j) {
      var o = document.createElement('option'); o.value = j[0]; o.textContent = j[0] + ' - ' + j[1]; sel.appendChild(o);
    });
    // Jenis di luar daftar (mis. dari file lama) tetap dimunculin, kalau nggak nilainya ilang diam-diam
    if (r.jenis && !IO_JENIS.some(function (j) { return j[0] === r.jenis; })) {
      var ox = document.createElement('option'); ox.value = r.jenis; ox.textContent = r.jenis + ' - tidak dikenal'; sel.appendChild(ox);
    }
    sel.value = r.jenis || '';
    sel.addEventListener('change', function () {
      r.jenis = sel.value;
      // Jenis yang cuma masuk akal satu arah langsung ngisi IN/OUT-nya - satu sumber salah input hilang
      if (IO_IN_ONLY[r.jenis]) r.io = 'IN';
      else if (IO_OUT_ONLY[r.jenis]) r.io = 'OUT';
      commit();
    });
    cell('c-jenis').appendChild(sel);

    var ioSel = document.createElement('select');
    ['', 'IN', 'OUT'].forEach(function (v) {
      var o = document.createElement('option'); o.value = v; o.textContent = v || '- pilih -'; ioSel.appendChild(o);
    });
    ioSel.value = r.io || '';
    ioSel.addEventListener('change', function () { r.io = ioSel.value; commit(); });
    cell('c-io').appendChild(ioSel);

    var km = document.createElement('input');
    km.value = r.komen; km.placeholder = 'ST1 STOPPER-2 CHUCK';
    km.addEventListener('change', function () { r.komen = km.value.trim(); commit(); });
    cell('').appendChild(km);

    var st = ioStationOf(r.komen);
    var tag = document.createElement('span');
    tag.className = 'st-tag' + (st === 'MAIN' ? ' main' : ''); tag.textContent = st;
    tag.title = st === 'MAIN' ? 'Komen gak menyebut ST<n>, masuk program MAIN' : 'Masuk program ' + st;
    cell('c-st').appendChild(tag);

    var rm = document.createElement('button');
    rm.type = 'button'; rm.className = 'rm'; rm.textContent = 'x'; rm.title = 'Hapus baris';
    rm.addEventListener('click', function () { ioRows.splice(i, 1); commit(); });
    cell('c-del').appendChild(rm);

    tb.appendChild(rowEl);
  });
  ioUpdateCount();
}

function ioUpdateCount() {
  var bad = ioProblems();
  var n = Object.keys(bad).length;
  var cnt = document.getElementById('ioCount');
  if (cnt) cnt.textContent = ioRows.length + ' baris';
  var pr = document.getElementById('ioProblems');
  if (pr) {
    pr.textContent = n ? (n + ' baris bermasalah - lihat kotak merah') : (ioRows.length ? 'Semua baris valid' : '');
    pr.className = 'io-problems' + (n ? '' : ' ok');
  }
}

function setIoView(v) {
  ioView = v;
  var grid = document.getElementById('ioGridWrap'), ta = document.getElementById('ioText');
  var tg = document.getElementById('ioTabGrid'), tt = document.getElementById('ioTabText');
  if (v === 'grid') { ioLoadFromText(); renderIoGrid(); }
  else { ioSyncToText(); }
  grid.style.display = v === 'grid' ? 'block' : 'none';
  ta.style.display = v === 'grid' ? 'none' : 'block';
  tg.className = 'io-tab' + (v === 'grid' ? ' active' : '');
  tt.className = 'io-tab' + (v === 'text' ? ' active' : '');
}

function downloadFile(name, text) {
  var b = new Blob([text], {type:'text/plain'});
  var u = URL.createObjectURL(b);
  var a = document.createElement('a');
  a.href = u; a.download = name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(u);
}

// SRV_CMD ikut masuk palette sequence: tiap command servo itu aktuator MANDIRI di gen_all.js
// (srvActus -> solByName), jadi node-nya valid dipakai sebagai langkah motion persis kayak SOL/CR.
// Tanpa SRV_CMD di sini, station yang aktuatornya servo doang gak kegambar sama sekali di panel.
function actuatorNamesForStation(devices) {
  return (devices || [])
    .filter(function (d) { return d.io === 'OUT' && (d.jenis === 'CR' || d.jenis === 'SOL' || d.jenis === 'SRV_CMD'); })
    .map(function (d) { return d.name; })
    .filter(Boolean);
}

// Object.keys(groups) ngikutin urutan device pertama kali MUNCUL di IO list, bukan urutan angka ST -
// kalau IO list-nya nulis ST3 duluan baru ST1, panel bakal kegambar ST3 duluan. Sort numerik di sini.
function sortStations(keys) {
  return keys.slice().sort(function (a, b) {
    return (parseInt(a.replace(/\D/g, ''), 10) || 0) - (parseInt(b.replace(/\D/g, ''), 10) || 0);
  });
}

var lastArrayRows = [];

  visited[from] = true;

  if (!n || !n.after) return false;
  for (var i = 0; i < n.after.length; i++) {

function addEdge(st, vIdx, fromId, toId) {

  var target = motionState[st][vIdx].nodes[ti];
  // Node "condition" itu SUMBER (penanda bit rujukan), gak pernah jadi tujuan panah.
  if ((target.type || 'motion') === 'condition') return false;
  if (target.after.indexOf(fromId) >= 0) return false;
  // Cegah cycle: kalau fromId udah (transitif) tergantung ke toId, nambah toId->depends-on->fromId bikin muter.
  if (hasPath(st, vIdx, fromId, toId)) return false;

// tiap node cuma makan lebar. Nama simbolnya tetap ada di tooltip, dan yang dipakai JSON maupun
// generator tetap simbol - ini murni yang dilihat mata.
function deviceLabel(sym) {

function nodeLabel(n) {

  if (t === 'resetmem')  return 'RST ' + (n.bit || '(bit?)') + tail;

// Lebar node ngikutin panjang label, gak dipotong lagi. Dulu label dipangkas 15 char jadi
// "SOL_ST1_STP4_.." - dua stopper beda kelihatan sama persis di canvas, gak bisa dibedain.
// Font .gnode-text 10.5px Consolas = ~6.1px/char (advance monospace ~0.55em, dilebihin dikit biar
// aman); +18 buat padding kiri-kanan. Minimal tetap NODE_W biar node berlabel pendek gak jadi kotak
// kecil. ANGKA INI TERIKAT ke font-size .gnode-text - ubah salah satu, ubah dua-duanya.
function nodeW(n) { return Math.max(NODE_W, Math.ceil(nodeLabel(n).length * 6.1) + 18); }

// Titik sambung kabel dipilih dinamis: SISI node yang paling searah ke lawan bicaranya (atas, bawah,
// kiri, atau kanan), bukan selalu kanan->kiri kayak dulu. Bandingin kemiringan garis pusat-ke-pusat

// Pakai nodeW(n) bukan NODE_W biar tetap nempel pas node-nya melebar ngikutin label.
function sideAnchor(n, towardX, towardY) {

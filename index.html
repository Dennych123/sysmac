<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Susmax Program Generator</title>
<style>
  /* Tool ini dipakai di layar PC dan isinya padat teks. Dua keputusan dasar di sini:
     (1) lebar ikut layar sampai 1680px - tabel IO, kanvas flowchart, dan JSON semuanya butuh ruang
         horizontal; dikurung 1040px bikin semuanya kesempitan dan sering wrap gak perlu.
     (2) teks sekunder DINAIKIN kontras dan ukurannya. Sebelumnya .hint 11px warna #5c6673 - itu
         gabungan terburuk: kecil DAN pudar, padahal isinya penjelasan yang justru perlu dibaca. */
  :root{
    --fg:#111827;--muted:#4b5563;--faint:#6b7280;
    --line:#d6dbe3;--line-soft:#e6eaf0;--card:#fff;--bg:#f1f4f8;
    --accent:#2563eb;--accent-dk:#1d4ed8;--accent-soft:#eff5ff;
    --ok:#15803d;--warn:#b45309;--danger:#b91c1c;
    --radius:8px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  }
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       max-width:1680px;margin:0 auto;padding:24px 28px 64px;color:var(--fg);background:var(--bg);
       font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  h1{font-size:22px;font-weight:650;margin:0 0 2px;letter-spacing:-.01em}
  /* Judul section: teks penuh kontras + garis aksen di kiri, bukan huruf kapital abu-abu kecil yang
     dulu malah kebaca lebih lemah dari isinya. */
  h2{font-size:15px;font-weight:650;color:var(--fg);margin:32px 0 8px;padding:0 0 0 10px;
     border-left:3px solid var(--accent);line-height:1.3}
  code{font-family:Consolas,Menlo,monospace;font-size:.92em;background:var(--accent-soft);
       border:1px solid #dbe6fb;border-radius:4px;padding:1px 4px}
  textarea{width:100%;box-sizing:border-box;font-family:Consolas,Menlo,monospace;font-size:12.5px;
           line-height:1.5;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--card);
           color:var(--fg)}
  textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  #ioText{height:240px}

  /* ===== Editor IO list mode tabel ===== */
  .io-tabs{display:flex;align-items:center;gap:6px;margin:8px 0 6px}
  .io-tab{background:transparent;color:var(--muted);border:1px solid var(--line);padding:6px 14px;margin:0;
          font-size:13px;font-weight:500;border-radius:6px}
  .io-tab:hover{background:#e8edf5;color:var(--fg)}
  .io-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .io-count{margin-left:auto;font-size:12.5px;color:var(--muted)}
  .io-grid-scroll{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:7px;background:var(--card)}
  #ioGrid{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
  #ioGrid th{position:sticky;top:0;z-index:1;background:#eef2f8;text-align:left;font-weight:600;font-size:12px;
             color:var(--muted);padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  #ioGrid td{padding:3px 6px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  #ioGrid tr:last-child td{border-bottom:none}
  #ioGrid tr:hover td{background:#f8fafc}
  #ioGrid .rn{color:var(--faint);font-size:11px;text-align:right;width:38px;font-family:Consolas,monospace}
  #ioGrid input,#ioGrid select{font-size:12.5px;padding:5px 6px;border:1px solid var(--line);border-radius:5px;
                               background:#fff;color:var(--fg);width:100%}
  #ioGrid input{font-family:Consolas,monospace}
  #ioGrid .c-addr{width:130px}
  #ioGrid .c-jenis{width:200px}
  #ioGrid .c-io{width:92px}
  #ioGrid .c-st{width:64px}
  #ioGrid .c-del{width:34px}
  #ioGrid .bad input,#ioGrid .bad select{border-color:var(--danger);background:#fef2f2}
  #ioGrid .st-tag{display:inline-block;font-family:Consolas,monospace;font-size:11px;padding:1px 6px;border-radius:4px;
                  background:#eef2ff;color:#3730a3;border:1px solid #dbe0fb}
  #ioGrid .st-tag.main{background:#f1f5f9;color:#475569;border-color:#e2e8f0}
  #ioGrid .rm{background:#e5e7eb;color:#374151;padding:3px 8px;margin:0;font-size:12px;line-height:1}
  #ioGrid .rm:hover{background:var(--danger);color:#fff}
  .io-grid-bar{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .io-add{background:#374151;padding:6px 12px;margin:0;font-size:12.5px}
  .io-add:hover{background:#1f2937}
  .io-problems{font-size:12.5px;color:var(--danger);font-weight:500}
  .io-problems.ok{color:var(--ok);font-weight:400}
  button{padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;background:var(--accent);color:#fff;
         border:none;border-radius:6px;margin-top:8px;transition:background .12s,box-shadow .12s}
  button:hover{background:var(--accent-dk)}
  button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
  button.dl{background:#374151;padding:5px 11px;margin:0}
  button.dl:hover{background:#1f2937}
  #genBtn{font-size:14px;padding:10px 22px;box-shadow:var(--shadow)}
  .hint{font-size:12.5px;color:var(--muted);margin:6px 0;max-width:110ch}
  #err{white-space:pre-wrap;color:var(--danger);font-family:Consolas,monospace;font-size:12.5px;margin-top:10px}
  #stats{white-space:pre-wrap;color:var(--fg);font-family:Consolas,monospace;font-size:12px;line-height:1.6;
         margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:12px 14px;
         box-shadow:var(--shadow);overflow-x:auto}

  .warn-box{display:none;background:#fffbeb;border:1px solid #fcd34d;border-left:4px solid #d97706;
            border-radius:7px;padding:12px 14px;margin-top:12px}
  .warn-box b{color:#92400e;font-size:13px}
  #warn{color:#78350f;font-size:12.5px;line-height:1.6;margin-top:6px}
  .warn-grp{font-weight:650;color:#92400e;margin:8px 0 2px;font-size:12.5px}
  .warn-grp:first-child{margin-top:2px}
  .warn-item{display:flex;gap:8px;align-items:baseline;padding:2px 0 2px 4px}
  .warn-code{flex:none;font-family:Consolas,monospace;font-size:11px;background:#fef3c7;border:1px solid #fcd34d;
             border-radius:3px;padding:0 5px;color:#92400e}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand h1{margin:0}
  .by{font-size:12px;color:var(--muted);margin-top:2px}
  .by a{color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--line)}
  .by a:hover{color:var(--fg)}
  .foot{margin:34px 0 8px;padding-top:14px;border-top:1px solid var(--line);
        font-size:12px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .foot a{color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--line)}
  .foot a:hover{color:var(--fg)}
  .foot .dot{opacity:.5}
  .sec-head{display:flex;align-items:center;gap:2px;margin:26px 0 6px}
  .sec-head h2{margin:0}
  /* Ikon bantuan: teks panjang pindah ke sini supaya halaman tetap terbaca sekali lihat.
     Tooltip-nya CSS murni - tidak ada JS yang bisa nyangkut, dan tetap jalan di file://. */
  .help{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 5px;
        border-radius:9px;border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:700;
        cursor:help;position:relative;margin-left:6px;vertical-align:middle;user-select:none}
  .help:hover{border-color:var(--muted);color:var(--fg)}
  .help::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 7px);
        width:340px;max-width:76vw;background:var(--card);color:var(--fg);border:1px solid var(--line);
        border-radius:8px;padding:9px 11px;font-size:12.5px;font-weight:400;line-height:1.55;text-align:left;
        box-shadow:0 8px 24px rgba(0,0,0,.20);opacity:0;visibility:hidden;transition:opacity .12s;
        z-index:60;pointer-events:none}
  .help:hover::after{opacity:1;visibility:visible}
  .settings-row label .help{margin-left:4px}
  .settings-row{display:flex;flex-wrap:wrap;gap:16px;margin:10px 0}
  .settings-row label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px;font-weight:500}
  .settings-row input,.settings-row select{font-family:Consolas,monospace;font-size:13px;padding:7px 9px;
                      border:1px solid var(--line);border-radius:6px;width:140px;background:var(--card);color:var(--fg)}
  .settings-row select{width:auto;min-width:220px}
  .settings-row label.chk{flex-direction:row;align-items:center;gap:7px;align-self:flex-end;padding-bottom:8px}
  .settings-row label.chk input{width:auto}
  .hmi-map{max-height:340px;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:7px}
  .btn-sm{align-self:flex-end;font-size:12.5px;padding:7px 12px;border:1px solid var(--line);border-radius:6px;
          background:var(--card);color:var(--fg);cursor:pointer;font-weight:600}
  .btn-sm:hover{border-color:var(--muted)}
  .array-sheet .row{flex-wrap:wrap;gap:8px;align-items:center}
  .array-sheet .hint{margin:4px 0 0}
  .sheet-ctl{font-family:Consolas,monospace;font-size:12.5px;padding:5px 8px;border:1px solid var(--line);
             border-radius:6px;background:var(--card);color:var(--fg)}
  .sheet-chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
  .sheet-msg{font-size:12.5px;color:var(--muted);min-width:120px}
  .sheet-wrap{max-height:420px;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:7px}
  .sheet{border-collapse:collapse;width:100%;font-family:Consolas,monospace;font-size:12px}
  .sheet th{position:sticky;top:0;z-index:1;background:var(--card);text-align:left;padding:6px 9px;
            border:1px solid var(--line);color:var(--muted);font-weight:600}
  .sheet td{padding:3px 9px;border:1px solid var(--line);white-space:nowrap}
  .sheet td.n{text-align:right;color:var(--muted);width:1%}
  .sheet td.k{font-weight:600}
  .sheet td.c{white-space:normal;min-width:280px}
  .sheet tr.spare td{color:var(--muted)}
  .sheet tr:hover td{background:rgba(127,127,127,.10)}
  .hmi-tbl{border-collapse:collapse;width:100%;font-family:Consolas,monospace;font-size:12px}
  .hmi-tbl th{position:sticky;top:0;background:var(--card);text-align:left;padding:6px 9px;
              border-bottom:1px solid var(--line);color:var(--muted);font-weight:600}
  .hmi-tbl td{padding:4px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
  .hmi-tbl td:first-child{font-weight:600;color:var(--fg)}
  .hmi-tbl tr.hmi-in td:nth-child(3){color:#1d7a4c}
  .hmi-tbl tr.hmi-out td:nth-child(3){color:#8a5a00}
  .stname-panel{display:none;flex-wrap:wrap;gap:10px;margin:10px 0}
  .stname-lbl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);background:var(--card);
              border:1px solid var(--line);border-radius:7px;padding:7px 10px;box-shadow:var(--shadow)}
  .stname-lbl b{color:var(--fg);font-family:Consolas,monospace;font-size:12.5px}
  .stname-input{font-family:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--line);border-radius:5px;width:180px}
  .cm-row{flex-direction:column;align-items:flex-start;gap:5px;min-width:230px;border-left:3px solid transparent}
  .cm-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  /* Merah = generator gak nemu sensornya sama sekali, harus disetel. Kuning = ketemu tapi tebakannya
     lemah, jalan tapi layak dicek. Aktuator yang sudah dioverride balik netral. */
  .cm-row.cm-missing{border-left-color:var(--danger);background:#fef2f2;border-color:#fca5a5}
  .cm-row.cm-check{border-left-color:#d97706;background:#fffbeb;border-color:#fcd34d}
  .cm-badge{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:3px;white-space:nowrap}
  .cm-badge-missing{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
  .cm-badge-check{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
  .cm-row select{font-family:inherit;font-size:12.5px;padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:#fff}
  .cm-row .cm-manual{display:flex;gap:5px}
  .cm-row .cm-manual input{font-family:Consolas,monospace;font-size:12px;padding:5px 7px;border:1px solid var(--line);border-radius:5px;width:130px}

  .single{background:#eef4ff;border:1px solid #bcd3f9;border-radius:var(--radius);padding:12px 14px;margin:14px 0}
  .single .t{font-weight:600;margin-bottom:2px}
  .single .d{font-size:11px;color:var(--muted);margin-bottom:8px}
  details.per-program{margin-top:10px}
  details.per-program>summary{cursor:pointer;font-size:13px;color:var(--fg);font-weight:500;padding:7px 2px;list-style:none}
  details.per-program>summary::-webkit-details-marker{display:none}
  details.per-program>summary::before{content:"▸ ";color:var(--accent)}
  details.per-program[open]>summary::before{content:"▾ "}
  .file{margin-bottom:12px;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--card)}
  .file .row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .file b{font-family:Consolas,monospace}
  .file textarea{height:140px;margin-top:6px;font-size:10px;white-space:pre;overflow:auto}

  #motionPanel{display:none;margin:10px 0}
  #conditionPanel{display:none;margin:10px 0}
  .cond-group-box{border:1px dashed #c7ccd4;border-radius:6px;padding:6px;margin:6px 0;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
  .cond-or-label{font-weight:bold;color:#c2670a;font-size:11px;margin-right:4px}
  .cond-term{display:inline-flex;align-items:center;background:#eef2ff;border-radius:4px;padding:2px 2px 2px 4px;font-family:Consolas,monospace;font-size:11px;gap:3px}
  .cond-neg{background:var(--accent);color:#fff;padding:2px 6px;margin:0;font-size:9px;border-radius:3px}
  .cond-neg.active{background:#b91c1c}
  .cond-neg:hover{opacity:0.85}
  .cond-term-bit{padding:0 2px}
  .cond-rm-term{background:#9aa3ad;color:#fff;padding:1px 6px;margin:0;font-size:10px;border-radius:3px}
  .cond-rm-term:hover{background:#7c848d}
  .cond-term-input{font-family:Consolas,monospace;font-size:11px;padding:3px 5px;border:1px solid var(--line);border-radius:4px;width:130px}
  .station-box{border:2px solid #b7c0cc;border-radius:var(--radius);padding:10px 12px;margin-bottom:16px;background:var(--card);box-shadow:0 1px 3px rgba(20,30,50,.06)}
  .station-title{font-weight:600;font-size:13px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .variant-box{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:10px;background:#fbfcfd}
  .variant-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
  .variant-head b{font-size:11px;color:var(--muted)}
  .variant-head input{font-family:Consolas,monospace;font-size:11px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;width:140px}
  .variant-head select{font-family:Consolas,monospace;font-size:11px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:#fff;max-width:230px}
  .variant-head .rm-variant{background:#b91c1c;padding:3px 8px;margin:0;font-size:10px}
  .variant-head .rm-variant:hover{background:#8f1717}
  .add-variant{background:#37424f;padding:5px 10px;font-size:11px}
  .add-variant:hover{background:#232a33}
  .graph-toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
  .avail-btn{background:#eceff3;color:var(--fg);padding:4px 8px;margin:0;font-size:11px;font-family:Consolas,monospace}
  .avail-btn:hover{background:#dde2e8}
  .graph-toolbar input{font-family:Consolas,monospace;font-size:11px;padding:4px 6px;border:1px solid var(--line);border-radius:4px}
  .graph-toolbar select{font-family:Consolas,monospace;font-size:11px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:#fff;max-width:230px}
  .graph-toolbar .add-cond{background:#7c3aed;padding:4px 10px;margin:0;font-size:11px}
  .graph-toolbar .add-cond:hover{background:#6527c9}
  svg.graph-canvas{border:1px solid var(--line);border-radius:6px;background:#fbfbfc;display:block;max-width:100%}
  .gnode-rect{fill:var(--accent);stroke:var(--accent-dk);stroke-width:1;cursor:move}
  .gnode-rect.condition{fill:#7c3aed;stroke:#5b21b6;stroke-dasharray:4,2}
  .gnode-rect.decision{fill:#0f766e;stroke:#0b544e}
  .gnode-rect.setmem{fill:#b45309;stroke:#8a4008}
  .gnode-rect.resetmem{fill:#7c2d12;stroke:#5c210d}
  .gnode-rect.alarm{fill:#b91c1c;stroke:#8f1717}
  .gnode-handle.port-n{fill:#e5e7eb}
  .gport-text{font-size:8px;fill:#111;font-family:Consolas,monospace;pointer-events:none;text-anchor:middle}
  .graph-hint{font-size:11px;color:#8a4008;background:#fff7ed;border:1px solid #fed7aa;border-radius:4px;padding:5px 8px;margin-top:4px}
  .gnode-rect.selected{stroke:#f1c40f;stroke-width:3}
  .gnode-rect.anchor{fill:#37424f;stroke:#232a33;cursor:move;rx:14}
  .gedge-line.anchor{stroke:#9aa3ad;stroke-dasharray:3,2}
  .gnode-text{fill:#fff;font-size:10.5px;font-family:Consolas,monospace}
  .gnode-del{fill:#b91c1c;cursor:pointer}
  .gnode-del-text{fill:#fff;font-size:9px;text-anchor:middle;font-family:Consolas,monospace;pointer-events:none}
  .gnode-handle{fill:#f1c40f;stroke:#333;stroke-width:1;cursor:crosshair}
  /* Tombol hapus dan bulatan sambung cuma muncul pas kursor di atas node-nya (atau node lagi
     keselect). Dulu semuanya kelihatan sekaligus - di flowchart 8 node itu 16 bulatan berwarna yang
     bersaing perhatian sama isi diagramnya sendiri. pointer-events ikut dimatikan pas tersembunyi,
     biar gak ada target klik tak kasatmata. */
  .gnode .gnode-del,.gnode .gnode-del-text,.gnode .gnode-handle,.gnode .gport-text{
    opacity:0;pointer-events:none;transition:opacity .1s}
  .gnode:hover .gnode-del,.gnode:hover .gnode-handle,
  .gnode.sel .gnode-del,.gnode.sel .gnode-handle{opacity:1;pointer-events:auto}
  .gnode:hover .gnode-del-text,.gnode:hover .gport-text,
  .gnode.sel .gnode-del-text,.gnode.sel .gport-text{opacity:1}
  .gedge-line{stroke:#8a93a0;stroke-width:2;cursor:pointer}
  .gedge-line:hover{stroke:#b91c1c}
  .gedge-line.selected{stroke:#f1c40f;stroke-width:3}
  .gtemp-line{stroke:var(--accent);stroke-width:2;stroke-dasharray:4,2}
  .gjoin-badge{cursor:pointer}
  .gjoin-badge rect{fill:#333}
  .gjoin-badge text{fill:#fff;font-size:8px;text-anchor:middle;font-family:Consolas,monospace}
  details.json-io{border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}
  details.json-io>summary{cursor:pointer;font-size:11px;color:var(--muted);list-style:none;padding:2px 0}
  details.json-io>summary::-webkit-details-marker{display:none}
  details.json-io>summary::before{content:"▸ ";color:var(--accent)}
  details.json-io[open]>summary::before{content:"▾ "}
  .json-io textarea{height:90px;font-size:10px;margin-top:6px}
  .json-io .row{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;align-items:center}
  .json-io button{font-size:11px;padding:5px 10px;margin:0}
  .json-io .json-import{background:#1e8449}
  .json-io .json-import:hover{background:#166638}
  .json-io .json-export{background:#37424f}
  .json-io .json-export:hover{background:#232a33}
  .json-io .json-alt{background:#0369a1}
  .json-io .json-alt:hover{background:#025782}
  .json-io .row-sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
  .json-io .json-msg{font-size:10px;margin-top:4px;white-space:pre-wrap}
  .json-io .json-msg.ok{color:#1e8449}
  .json-io .json-msg.err{color:#b91c1c}
  details.project-json{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:14px 0;
                       background:var(--card);box-shadow:var(--shadow)}
  details.project-json>summary{font-size:13.5px;font-weight:600;color:var(--fg);cursor:pointer}
  .project-json textarea{height:180px}

  /* Section yang bisa dilipat (mis. Confirm Mode). Dipakai buat bagian OPSIONAL yang kalau selalu
     kebuka cuma makan tinggi layar - ringkasannya tetap kelihatan di summary jadi gak perlu dibuka
     kecuali memang mau diubah. */
  details.fold{border:1px solid var(--line);border-radius:8px;background:var(--card);margin:14px 0;
               padding:0 14px;box-shadow:var(--shadow)}
  details.fold>summary{cursor:pointer;padding:12px 0;list-style:none;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  details.fold>summary::-webkit-details-marker{display:none}
  details.fold>summary::before{content:"\25B8";color:var(--accent);font-size:12px}
  details.fold[open]>summary::before{content:"\25BE"}
  details.fold[open]{padding-bottom:14px}
  .fold-t{font-size:15px;font-weight:650;color:var(--fg)}
  .fold-sub{font-size:12.5px;color:var(--faint)}
  .fold-sub.attn{color:var(--warn);font-weight:600}

<body>
<div class="topbar">
  <div class="brand">
    <h1>Susmax Program Generator</h1>
    <div class="by"><span>by</span>
      <a href="https://github.com/Dennych123" target="_blank" rel="noopener">Dennych123</a></div>
  </div>

</div>

<div class="sec-head">
  <h2>I/O list</h2>
  <span class="help" data-tip="Four columns: Address, Type, IN/OUT, Comment. A comment containing ST1 / ST2 / ST3 goes into that unit program; no ST tag goes into MAIN. Table mode gives you dropdowns so Type and IN/OUT cannot be mistyped. Text mode takes a TAB-separated paste straight from Excel. Both hold the same list, switch any time.">?</span>
</div>
<div class="io-tabs">
  <button type="button" class="io-tab active" id="ioTabGrid">Table</button>
  <button type="button" class="io-tab" id="ioTabText">Text (TSV)</button>
  <span class="io-count" id="ioCount"></span>
</div>
<div id="ioGridWrap">
  <div class="io-grid-scroll"><table id="ioGrid"><tbody></tbody></table></div>
  <div class="io-grid-bar">
    <button type="button" class="io-add" id="ioAddRow">+ Row</button>
    <button type="button" class="io-add" id="ioPaste">Paste</button>
    <span class="io-problems" id="ioProblems"></span>
  </div>
</div>
<textarea id="ioText" placeholder="CH000_00&#9;PB&#9;IN&#9;NOT EMERGENCY STOP"></textarea>
<div><button id="genBtn">Generate</button></div>
<div id="err"></div>
<div id="warnBox" class="warn-box"><b>Warnings</b><div id="warn"></div></div>

<div class="sec-head">
  <h2>Settings</h2>
  <span class="help" data-tip="These apply to every station. Timer format is T#<number><unit> - T#200MS, T#1S, T#2M. A wrong format falls back to the default and raises a warning instead of going into the ladder. Station names are optional and only show up in the generated comments.">?</span>
</div>
<div class="settings-row">
  <label><span>PH/PX debounce</span> <input id="timerPhpx" placeholder="T#200MS"></label>
  <label><span>Motion fault time</span> <input id="timerMotion" placeholder="T#5S"></label>
  <label><span>AL array size</span> <input id="alSize" type="number" min="1" placeholder="100"></label>
  <label><span>MF array size</span> <input id="mfSize" type="number" min="1" placeholder="16"></label>
  <label><span>Slots per station</span> <input id="stationBlock" type="number" min="1" placeholder="30"></label>
  <label class="chk"><input id="advInstr" type="checkbox"> <span>Advanced instructions</span>
    <span class="help" data-tip="Off by default. Contacts, coils and TON are proven to import. MOVE, comparisons, Inc and the clock functions are not - one bad element can make the whole file fail to import. Generate first with this off, import _Probe_Instructions.xml into an EMPTY project, and only turn this on once that comes in clean. Then the counters and clock pulses get generated for real.">?</span></label>
</div>
<div id="arraySizeHint" class="hint" style="margin-top:2px"></div>
<div id="stationNamesPanel" class="stname-panel"></div>

<details id="hmiBox" class="fold">
<summary><span class="fold-t">HMI address map</span>
  <span class="help" data-tip="The PLC and the NB panel only talk through memory addresses - there are no tags. Every button and lamp gets an AT address, written into the AT column of GlobalVariables.tsv. Buttons for station n sit at base + n words, lamps at the same word plus the offset. Inside one word each grid slot takes 2 bits: page 1 uses .00 to .07, page 2 uses .08 to .15.">?</span>
  <span class="fold-sub" id="hmiSummary">not generated yet</span></summary>
<div class="settings-row">
  <label><span>Screen source</span>
    <span class="help" data-tip="Manual - you maintain the NB screens, so addresses are never shifted on their own; an actuator that does not fit is reported instead. Generate - the tool builds the screens, so the word budget may grow and the screens follow the new addresses.">?</span>
    <select id="hmiMode">
      <option value="manual">Manual - I maintain the screens</option>
      <option value="generate">Generate - tool builds the screens</option>
    </select></label>
  <label><span>Button/lamp area</span> <select id="hmiBtnArea">
    <option value="W">W</option><option value="H">H</option><option value="D">D</option><option value="CIO">CIO</option>
  </select></label>
  <label><span>Button base word</span> <input id="hmiPbBase" type="number" min="0" max="511" placeholder="460"></label>
  <label><span>Lamp word offset</span> <input id="hmiRdOffset" type="number" min="1" max="511" placeholder="23"></label>
  <label><span>AL/MF area</span> <select id="hmiAlArea">
    <option value="H">H</option><option value="W">W</option><option value="D">D</option><option value="CIO">CIO</option>
  </select></label>
  <label><span>AL base word</span> <input id="hmiAlBase" type="number" min="0" max="511" placeholder="300"></label>
  <label><span>MF base word</span> <input id="hmiMfBase" type="number" min="0" max="511" placeholder="320"></label>
  <label><span>Actuators per screen</span> <input id="hmiPerPage" type="number" min="1" max="8" placeholder="4"></label>
  <label><span>Words per station</span> <input id="hmiStride" type="number" min="1" max="16" placeholder="1"></label>
  <label class="chk"><input id="hmiEnabled" type="checkbox" checked> <span>Fill AT column</span></label>
</div>
<div id="hmiMapPanel" class="hmi-map"></div>
</details>

<details id="confirmModeBox" class="fold">
<summary><span class="fold-t">Actuator confirm mode</span>
  <span class="help" data-tip="Auto - the sensor is matched for you. Open-loop - the actuator has no sensor by design (DANDORI LOCK, PART FEEDER START); fault detection is skipped and so is the no-sensor warning, but it can no longer be used in a motion sequence because there is no confirm bit to step on. Manual - the automatic match picked the wrong sensor, so you name the confirm bits yourself.">?</span>
  <span class="fold-sub" id="confirmModeSummary">optional</span></summary>
<div id="confirmModePanel" class="stname-panel"></div>
</details>

<details class="json-io project-json" open>
  <summary><span>Project file</span>
    <span class="help" data-tip="Everything in one file: I/O list, motion sequences, conditions, station names, timers and the HMI map. Loading a file replaces the whole project that is open and runs Generate again.">?</span></summary>
  <textarea id="projectJsonTa" spellcheck="false"
    placeholder='{"io":"...","stationNames":{},"motionSequences":{},"conditionDefs":{}}'></textarea>
  <div id="projectJsonRow"></div>
  <span class="json-msg" id="projectJsonMsg"></span>
</details>

<div class="sec-head">
  <h2>Conditions</h2>
  <span class="help" data-tip="Each station can have as many named condition bits as it needs. One bit = several AND groups joined by OR - the same shape as a Denso condition rung. A term can point at a sensor, any existing bit, or another condition bit. A bit that does not exist yet gets a placeholder so the import never fails. Stations you never touch keep the three generic spare slots.">?</span>
</div>
<div id="conditionPanel"></div>

<div class="sec-head">
  <h2>Motion sequence</h2>
  <span class="help" data-tip="A station can hold several sequence variants, each with its own condition bit - leave it empty and the variant always runs. Only the variant whose condition is true will run. Click a solenoid to drop a step, then drag from the yellow dot to another step to say what has to finish first. A step waiting on two or more others gets an AND/OR badge you can toggle. Drag steps only to tidy the layout.">?</span>
  <span class="help" data-tip="IF/ELSE - one in, two out (Y on the right, N below). Once the decision is taken the branch holds, and the two sides interlock so they can never be on together. SET/RESET memory - a latching bit; every set and reset trigger for one bit is merged into a single rung, so there is no double coil. ALARM - takes an AL slot automatically, latches itself and joins the category group you pick. To merge two branches, drag both Y and N into the same step and set its badge to OR. Click a step to edit its bit, category and comment. Select and press Delete to remove.">blocks</span>
</div>
<div id="motionPanel"></div>

<div id="results"></div>
<footer class="foot">
  <span>Made by</span>
  <a href="https://github.com/Dennych123" target="_blank" rel="noopener">Dennych123</a>
  <span class="dot">/</span>
  <a href="https://github.com/Dennych123/sysmac" target="_blank" rel="noopener">github.com/Dennych123/sysmac</a>
</footer>
<div id="stats"></div>

<script>
var PARSE_JS    = "// Input: TSV 4 kolom -> Alamat | Jenis | IN/OUT | Komen\nvar raw = msg.payload || \"\";\nvar rows = raw.trim().split('\\n').filter(function(r){return r.trim() !== \"\";});\nmsg.payload = rows.map(function(r, i){\n    var c = r.split('\\t');\n    return { row:i+1, address:(c[0]||\"\").trim(), jenis:(c[1]||\"\").trim().toUpperCase(),\n             io:(c[2]||\"\").trim().toUpperCase(), komen:(c[3]||\"\").trim() };\n});\nreturn msg;\n";
var GENNAME_JS  = "// Generate nama symbol dari Jenis + Komen (sama persis dengan flow CX supaya nama konsisten)\nvar PRE = {PB:\"PB_\",CR:\"CR_\",LS:\"LS_\",SS:\"SS_\",\"2P\":\"P2_\",PH:\"PH_\",PX:\"PX_\",PL:\"PL_\",BZ:\"BZ_\",AS:\"AS_\",SOL:\"SOL_\",SRV_LS:\"LS_\",SRV_CMD:\"SRV_\"};\nvar ABBR = {CONFIRM:\"CNF\",CONF:\"CNF\",CLOSE:\"CLS\",OPEN:\"OPN\",FORWARD:\"FWD\",BACKWARD:\"BWD\",POSITION:\"POS\",SENSOR:\"SNR\",\nWORKPIECE:\"WP\",WORK:\"WP\",PIECE:\"PC\",DETECT:\"DET\",PRESENCE:\"PRS\",READY:\"RDY\",START:\"STR\",STOP:\"STP\",EMERGENCY:\"EMG\",\nMASTER:\"MST\",BUTTON:\"BTN\",SWITCH:\"SW\",PRESSURE:\"PRS\",LOW:\"LOW\",HIGH:\"HI\",LEFT:\"LFT\",RIGHT:\"RGT\",FRONT:\"FRN\",REAR:\"RER\",\nCYLINDER:\"CYL\",COVER:\"CVR\",PLATE:\"PLT\",UP:\"UP\",DOWN:\"DN\",HOME:\"HM\",CENTER:\"CTR\",CENTRE:\"CTR\",AUTO:\"AUT\",MANUAL:\"MAN\",\nFAULT:\"FLT\",DANDORI:\"DDR\",SCAN:\"SCN\",TRANSFER:\"TRF\",EJECT:\"EJC\",EJECTOR:\"EJC\",PUSH:\"PSH\",PUSHER:\"PSH\",SHUTTER:\"SHT\",\nFLOW:\"FLW\",OUT:\"OUT\",IN:\"IN\",INSERT:\"INS\",EXIST:\"EXS\",STOPPER:\"STP\",CHUCK:\"CHK\",UNCHUCK:\"UCHK\",DIVIDER:\"DIV\",\nSAFETY:\"SFT\",INTERLOCK:\"INTLK\",FEEDER:\"FDR\",TOWER:\"TWR\",LAMP:\"LMP\",GREEN:\"GRN\",YELLOW:\"YLW\",RED:\"RED\",FULL:\"FULL\",\nRUNNING:\"RUN\",MACHINE:\"MC\",CYCLE:\"CYC\",RESET:\"RST\",ENABLE:\"ENB\",LOCK:\"LCK\",UNLOCK:\"ULCK\",KANBAN:\"KBN\",TRACE:\"TRC\",\nSOURCE:\"SRC\",GOOD:\"GOOD\",FUSE:\"FUSE\",PART:\"PART\",TYPE:\"TYP\"};\nfunction shortenWord(w){\n    var u = w.toUpperCase().replace(/[^A-Z0-9]/g,\"\");\n    if(!u) return \"\";\n    var m = u.match(/^([A-Z]+)(\\d*)$/);\n    if(m){ var b=m[1], n=m[2];\n        if(ABBR[b]) return ABBR[b]+n;\n        if(b.length>4){ b = b[0] + b.slice(1).replace(/[AEIOU]/g,\"\"); if(b.length>4) b=b.slice(0,4); }\n        return b+n; }\n    return u;\n}\nfunction prefixFor(j){ if(PRE[j]) return PRE[j]; if(!j) return \"X_\"; var p=j.replace(/[^A-Z0-9]/g,\"\"); if(/^[0-9]/.test(p)) p=\"T\"+p; return p+\"_\"; }\nfunction buildName(pre,k){ return pre + k.split(/\\s+/).filter(Boolean).map(shortenWord).filter(Boolean).join(\"_\"); }\nfunction std(jenis,io,komen){\n    var k = komen.toUpperCase().replace(/[^A-Z0-9\\s]/g,\"\");\n    if(k.indexOf(\"EMERGENCY\")>=0||k.indexOf(\"EMER STOP\")>=0){\n        if(io===\"OUT\"||k.indexOf(\"INTERLOCK\")>=0||k.indexOf(\"INTLK\")>=0) return \"EMER_INTLK\";\n        return \"NOT_EMG_STOP\"; }\n    if(k.indexOf(\"FUSE GOOD\")>=0) return \"FUSE_GOOD\";\n    if(k.indexOf(\"AIR SOURCE\")>=0||k.indexOf(\"AIR SC\")>=0) return \"AIR_SC_CONF\";\n    if(k.indexOf(\"SAFETY CONF\")>=0||k.indexOf(\"SAFE CONF\")>=0) return \"SAFE_CONF\";\n    if(k.indexOf(\"PLC GOOD\")>=0) return \"PLC_GOOD\";\n    if(k.indexOf(\"POWER ON\")>=0||k.indexOf(\"PWR ON\")>=0) return \"PWR_ON\";\n    if(k.indexOf(\"FAULT RESET\")>=0||k.indexOf(\"FLT RESET\")>=0) return \"PB_FLT_RST\";\n    if(k.indexOf(\"MACHINE STOP\")>=0) return \"PB_MC_STOP\";\n    if(k.indexOf(\"HOME POS\")>=0) return \"HOME_POS\";\n    if(k.indexOf(\"MASTER ON\")>=0){\n        if(jenis===\"PB\") return \"PB_MSTR_ON\";\n        if(jenis===\"PL\") return \"PL_MSTR_ON\";\n        if(k.indexOf(\"CONF\")>=0||k.indexOf(\"RDY\")>=0||jenis===\"CR\") return \"MSTR_RDY\";\n        return null; }\n    if(k.indexOf(\"AUTO RUN\")>=0||k.indexOf(\"AUTO RUNNING\")>=0){\n        if(jenis===\"PB\") return \"PB_AUTO_RUN\";\n        if(jenis===\"PL\") return \"PL_AUTO_RUN\";\n        return \"AUTO_RUN\"; }\n    if(k.indexOf(\"AUTO IND\")>=0||k.indexOf(\"AUTO MODE\")>=0) return \"SS_AUTO_IND\";\n    if(k.indexOf(\"CYCLE STOP\")>=0||k.indexOf(\"CYC STOP\")>=0) return \"PB_CYCL_STOP\";\n    return null;\n}\nvar devices = msg.payload || [];\nvar used = {};\ndevices.forEach(function(d){\n    var f = std(d.jenis,d.io,d.komen||\"\");\n    if(!f) f = buildName(prefixFor(d.jenis), d.komen||\"NONAME\");\n    var base=f, n=2;\n    while(used[f]){ f = base+\"_\"+n; n++; }\n    d.name = f; used[f]=1;\n});\nmsg.payload = devices;\nreturn msg;\n";
var VALIDATE_JS = "var devices = msg.payload || [];\nvar errors = [];\ndevices.forEach(function(d){\n    if(!d.address||!d.jenis||!d.io) errors.push(\"Baris \"+d.row+\": alamat/jenis/IN-OUT kosong\");\n    if(d.io && d.io!==\"IN\" && d.io!==\"OUT\") errors.push(\"Baris \"+d.row+\": kolom IN/OUT harus IN atau OUT, ketemu \"+d.io);\n});\nvar cnt = {};\ndevices.forEach(function(d){ if(!d.address||!d.io) return; var k=d.io+\"|\"+d.address; cnt[k]=(cnt[k]||0)+1; });\nObject.keys(cnt).forEach(function(k){ if(cnt[k]>1){ var p=k.split(\"|\"); errors.push(\"Address \"+p[1]+\" (\"+p[0]+\") dipakai lebih dari 1 kali\"); } });\nif(errors.length){ msg.payload = errors.join(\"\\n\"); return [null,msg]; }\nreturn [msg,null];\n";
var SPLIT_JS    = "// Split device list: komen ada ST1/ST2/ST3 -> unit; sisanya -> MAIN\nvar devices = msg.payload || [];\nvar groups = { MAIN: [] };\ndevices.forEach(function(d){\n    var m = (d.komen||\"\").toUpperCase().match(/\\bST\\s?(\\d+)\\b/);\n    var key = m ? (\"ST\"+m[1]) : \"MAIN\";\n    if(!groups[key]) groups[key]=[];\n    groups[key].push(d);\n});\nflow.set(\"groups\", groups);\nmsg.payload = groups;\nmsg.summary = Object.keys(groups).map(function(k){ return k+\"=\"+groups[k].length; }).join(\"  \");\nreturn msg;\n";
var GEN_ALL_JS  = "// ===== SG LIB : Susmax IEC61131-10 XML builder (shared, jangan diedit per-node) =====\n// Non-ASCII (di luar &<>) ditulis sebagai entitas numerik &#xNNNN;, BUKAN dibuang.\n// Dulu dibuang - aman selama input cuma yang diketik user di editor, tapi sejak\n// reader/ menyuntikkan fungsi ini buat menulis komentar rung/variabel dari\n// project SUNGGUHAN (reader/xml_out.js), komentar bermuatan '\\u00b15mm', '80\\u00b0C', atau\n// kutip pintar bekas tempel dari Word hilang diam-diam - tanpa error, tanpa tanda\n// di laporan. Entitas numerik tetap XML 1.0 yang sah apa pun deklarasi encoding-nya,\n// jadi tidak ada informasi yang hilang.\nfunction esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/[\\u2013\\u2014]/g,'-').replace(/\\u2192/g,'->').replace(/[^\\x00-\\x7F]/g,function(c){return '&#x'+c.codePointAt(0).toString(16).toUpperCase()+';';});}\nfunction Rung(o,c){this.o=o;this.c=c;this.a=[];this.n=1;}\nRung.prototype.rail=function(){var i=this.n++;this.a.push('<LdObject xsi:type=\"LeftPowerRail\"><ConnectionPointOut connectionPointOutId=\"'+i+'\" /></LdObject>');return i;};\nRung.prototype.ct=function(op,ref,neg,edge){var i=this.n++;this.a.push('<LdObject xsi:type=\"Contact\"'+(neg?' negated=\"true\"':'')+(edge?' edge=\"'+edge+'\"':'')+' operand=\"'+op+'\"><ConnectionPointIn><Connection refConnectionPointOutId=\"'+ref+'\" /></ConnectionPointIn><ConnectionPointOut connectionPointOutId=\"'+i+'\" /></LdObject>');return i;};\nRung.prototype.ctm=function(op,refs,neg){var i=this.n++;var r=refs.map(function(x){return '<Connection refConnectionPointOutId=\"'+x+'\" />';}).join('');this.a.push('<LdObject xsi:type=\"Contact\"'+(neg?' negated=\"true\"':'')+' operand=\"'+op+'\"><ConnectionPointIn>'+r+'</ConnectionPointIn><ConnectionPointOut connectionPointOutId=\"'+i+'\" /></LdObject>');return i;};\n// latch: \"set\" atau \"reset\" (coil S / R). Nama atributnya `latch`, nilainya none|set|reset -\n// dibaca dari XSD resminya, bukan ditebak. Lihat CLAUDE.md \"XSD resminya ADA di komputer ini\".\nRung.prototype.cl=function(op,ref,neg,edge,latch){var i=this.n++;this.a.push('<LdObject xsi:type=\"Coil\"'+(neg?' negated=\"true\"':'')+(edge?' edge=\"'+edge+'\"':'')+(latch?' latch=\"'+latch+'\"':'')+' operand=\"'+op+'\"><ConnectionPointIn><Connection refConnectionPointOutId=\"'+ref+'\" /></ConnectionPointIn><ConnectionPointOut connectionPointOutId=\"'+i+'\" /></LdObject>');return i;};\nRung.prototype.clm=function(op,refs,neg,latch){var i=this.n++;var r=refs.map(function(x){return '<Connection refConnectionPointOutId=\"'+x+'\" />';}).join('');this.a.push('<LdObject xsi:type=\"Coil\"'+(neg?' negated=\"true\"':'')+(latch?' latch=\"'+latch+'\"':'')+' operand=\"'+op+'\"><ConnectionPointIn>'+r+'</ConnectionPointIn><ConnectionPointOut connectionPointOutId=\"'+i+'\" /></LdObject>');return i;};\n// ===== Function block / instruksi umum =====\n// Bentuknya DITURUNKAN dari ton() di bawah - blok fungsi pertama yang terbukti ter-import\n// Susmax Studio. Yang dipakai ulang: pembungkus AddData buat urutan pin, DataSource buat\n// nilai masuk, dan ConnectionPointOut buat nilai keluar.\n//\n// SUDAH TERBUKTI ter-import: MOVE, bentuk EN,In -> ENO,Out (lewat _Probe_Instructions.xml).\n//\n// Daftar pin tiap instruksi ada di docs/SYSMAC_INSTRUCTIONS.md; yang WAJIB diingat waktu\n// memanggil blk() - dan yang bikin percobaan pertama ditolak semua:\n//   * FB butuh instanceName, FUN tidak boleh punya.\n//   * Pembanding (=, <, <=, <>, >=) dan Get**Clk TIDAK punya ENO. Minta \"ENO\" = ditolak.\n//     Pin hasilnya tidak bernama, jadi namanya ditulis \"\" (string kosong).\n//   * Pin In-out (Inc, Dec, Clear) muncul di daftar masuk DAN daftar keluar sekaligus,\n//     operandnya sama.\n// Bentuk-bentuk itu dibaca dari project nyata (`reader/cli.js x.smc2 --probe-fb`), tapi\n// PEMETAANNYA ke XML import masih diuji - lihat buildProbe() di js/gen_all.js.\nRung.prototype.ad=function(tag,ord){return '<AddData><Data name=\"https://www.ia.omron.com/Smc IEC61131_10_Ed1_0_SmcExt1_0_Spc1_0.xsd\" handleUnknown=\"discard\"><smcext:'+tag+' order=\"'+ord+'\" /></Data></AddData>';};\n// Nilai masuk: konstanta (\"16#0\", \"K100\") atau nama variabel\nRung.prototype.src=function(v){var i=this.n++;this.a.push('<FbdObject xsi:type=\"DataSource\" identifier=\"'+esc(String(v))+'\"><ConnectionPointOut connectionPointOutId=\"'+i+'\" /></FbdObject>');return i;};\n// Nilai keluar ditulis ke variabel\nRung.prototype.sink=function(v,ref){var i=this.n++;this.a.push('<FbdObject xsi:type=\"DataSink\" identifier=\"'+esc(String(v))+'\"><ConnectionPointIn><Connection refConnectionPointOutId=\"'+ref+'\" /></ConnectionPointIn></FbdObject>');return i;};\n// blk(\"MOVE\", null, [[\"EN\",enId],[\"In\",srcId]], [\"ENO\",\"Out\"]) -> { ENO:id, Out:id }\n//\n// Nama pin \"\" (kosong) itu SAH dan memang dipakai: lihat contoh resmi Omron di\n// \"Sysmac Studio/Sample/IEC 61131-10 XML/Controller/Sample.xml\".\n//\n// inouts (opsional) = [[\"InOut\", refId]] -> <InOutVariables>, buat Inc/Dec/Clear.\n// Pin in-out WAJIB lewat sini, jangan didaftar dua kali di ins+outs - itu bentuk model\n// internal Studio, bukan bentuk XML import, dan Studio menolaknya dengan \"The function\n// name is not defined\". Sisi keluarnya disambungkan ke sink dengan variabel yang SAMA.\n// URUTAN ELEMENNYA TERIKAT: <InOutVariables> HARUS pertama, baru <InputVariables>,\n// baru <OutputVariables>. Itu xsd:sequence, bukan selera. Menaruhnya terakhir ditolak:\n//   \"The element 'FbdObject' ... has invalid child element 'InOutVariables'\"\n// Nomor order dihitung MENYELURUH satu blok (EN=1, In=2, InOut=3), bukan per kelompok.\n//\n// Tulis HANYA pin yang dipakai. Contoh resmi Omron pun tidak menulis ENO waktu ENO-nya\n// tidak dipakai, dan tidak pernah meninggalkan satu pun titik keluar tanpa yang merujuk.\nRung.prototype.blk=function(typeName,instanceName,ins,outs,inouts){\n  var self=this, outIds={};\n  var xin=ins.map(function(p,k){\n    return '<InputVariable parameterName=\"'+esc(p[0])+'\"><ConnectionPointIn>'+self.ad('ConnectionPointInOrder',k+1)\n         + '<Connection refConnectionPointOutId=\"'+p[1]+'\" /></ConnectionPointIn></InputVariable>';\n  }).join('');\n  // Tiap pin keluar SELALU dapat <ConnectionPointOut>, dipakai atau tidak. Menghilangkan\n  // titik sambungnya memang sah menurut XSD (minOccurs=\"0\") tapi ditolak Studio waktu\n  // konversi: \"The function or the function block has invalid connection. Imported as an\n  // empty rung.\" - rung-nya hilang sama sekali, lebih parah daripada sekadar DefinitionError.\n  // Pin yang tidak dipakai cukup dibiarkan tanpa ada yang merujuk id-nya.\n  var xout=outs.map(function(nm,k){\n    var id=self.n++; outIds[nm]=id;\n    return '<OutputVariable parameterName=\"'+esc(nm)+'\"><ConnectionPointOut connectionPointOutId=\"'+id+'\">'\n         + self.ad('ConnectionPointOutOrder',k+1)+'</ConnectionPointOut></OutputVariable>';\n  }).join('');\n  var xio=(inouts||[]).map(function(p,k){\n    var id=self.n++; outIds[p[0]]=id;\n    return '<InOutVariable parameterName=\"'+esc(p[0])+'\">'\n         + '<ConnectionPointIn>'+self.ad('ConnectionPointInOrder',ins.length+k+1)\n         + '<Connection refConnectionPointOutId=\"'+p[1]+'\" /></ConnectionPointIn>'\n         + '<ConnectionPointOut connectionPointOutId=\"'+id+'\">'\n         + self.ad('ConnectionPointOutOrder',outs.length+k+1)+'</ConnectionPointOut></InOutVariable>';\n  }).join('');\n  this.a.push('<FbdObject xsi:type=\"Block\" typeName=\"'+esc(typeName)+'\"'\n   +(instanceName?' instanceName=\"'+instanceName+'\"':'')+'>'\n   +(xio?'<InOutVariables>'+xio+'</InOutVariables>':'')\n   +'<InputVariables>'+xin+'</InputVariables>'\n   +'<OutputVariables>'+xout+'</OutputVariables></FbdObject>');\n  return outIds;\n};\nRung.prototype.rr=function(refs){this.a.push('<LdObject xsi:type=\"RightPowerRail\">'+refs.map(function(x){return '<ConnectionPointIn><Connection refConnectionPointOutId=\"'+x+'\" /></ConnectionPointIn>';}).join('')+'</LdObject>');};\nRung.prototype.build=function(){var c=this.c?'<CommonObject xsi:type=\"Comment\"><Content xsi:type=\"SimpleText\">'+esc(this.c)+'</Content></CommonObject>':'';return '<Rung evaluationOrder=\"'+this.o+'\">'+c+this.a.join('')+'</Rung>';};\n\n// conds = [[operand, negated], ...]  -> AND series -> 1 coil\nfunction series(o,conds,out,cmt,outNeg,edge){var r=new Rung(o,cmt);var cur=r.rail();conds.forEach(function(c){cur=r.ct(c[0],cur,c[1]);});var x=r.cl(out,cur,outNeg,edge);r.rr([x]);return r.build();}\n// bits = [operand, ...]  -> OR (parallel dari rail) -> 1 coil, kebalikan AND-nya series()\nfunction orMany(o,bits,out,cmt){var r=new Rung(o,cmt);var rail=r.rail();var ids=bits.map(function(b){return r.ct(b,rail);});var x=r.clm(out,ids);r.rr([x]);return r.build();}\n// self-latch: (OR trigs OR bit) AND blocks -> bit\nfunction latch(o,trigs,bit,blocks,cmt){var r=new Rung(o,cmt);var rail=r.rail();var ids=trigs.map(function(t){return r.ct(t[0],rail,t[1]);});ids.push(r.ct(bit,rail));blocks=blocks||[];if(!blocks.length){var x=r.clm(bit,ids);r.rr([x]);return r.build();}var cur=r.ctm(blocks[0][0],ids,blocks[0][1]);for(var i=1;i<blocks.length;i++)cur=r.ct(blocks[i][0],cur,blocks[i][1]);var y=r.cl(bit,cur);r.rr([y]);return r.build();}\n// mutual-exclusion group: SATU rung, satu kontak gate dipakai bareng (mis. LB400), tiap branches[i]\n// = {trigs:[[op,neg],...], bit:coilBit, blocks:[[op,neg],...]} jadi cabang paralel dari gate ->\n// (OR trigs OR seal-diri sendiri) -> AND blocks (interlock ANDNOT branch lain) -> coil sendiri.\n// Semua coil nyambung ke SATU RightPowerRail (banyak ConnectionPointIn) - persis network Ndeso\n// \"Autorun Condition Running\" (LB400 di kiri, N baris kondisi mutual exclusion, N coil sejajar).\nfunction mutexGroup(o,gate,branches,cmt){\n    var r=new Rung(o,cmt); var rail=r.rail();\n    var start=gate?r.ct(gate[0],rail,gate[1]):rail;\n    var coilRefs=branches.map(function(br){\n        var ids=(br.trigs||[]).map(function(t){return r.ct(t[0],start,t[1]);});\n        ids.push(r.ct(br.bit,start));\n        var blocks=br.blocks||[];\n        if(!blocks.length) return r.clm(br.bit,ids);\n        var cur=r.ctm(blocks[0][0],ids,blocks[0][1]);\n        for(var i=1;i<blocks.length;i++) cur=r.ct(blocks[i][0],cur,blocks[i][1]);\n        return r.cl(br.bit,cur);\n    });\n    r.rr(coilRefs);\n    return r.build();\n}\n// groups = [[[operand,negated],...], ...] -> tiap group AND-series jadi 1 cabang, semua cabang OR -> 1 coil\n// (Condition section: satu bit boleh dinyalain lewat beberapa kombinasi syarat berbeda)\nfunction orOfAnds(o,groups,out,cmt){var r=new Rung(o,cmt);var rail=r.rail();var ends=groups.map(function(g){var cur=rail;g.forEach(function(c){cur=r.ct(c[0],cur,c[1]);});return cur;});var x=ends.length>1?r.clm(out,ends):r.cl(out,ends[0]);r.rr([x]);return r.build();}\n// dual-aux confirm Ndeso (3 rung)\nfunction dualAux(o,sa,aa,sb,ab,out,cmt){return series(o,[[sa,false]],aa,cmt)+series(o+1,[[sb,false]],ab)+series(o+2,[[aa,false],[ab,false]],out);}\n// LS Combination 2 posisi (2 rung)\nfunction ls2(o,af,ab,lf,lb,cmt){return series(o,[[af,false],[ab,true]],lf,cmt)+series(o+1,[[ab,false],[af,true]],lb);}\n// AutoOutput merge: LD auto OR ind OUT sol\nfunction merge2(o,a,b,out,cmt){var r=new Rung(o,cmt);var rail=r.rail();var ids=[r.ct(a,rail)];if(b)ids.push(r.ct(b,rail));var x=(ids.length>1)?r.clm(out,ids):r.cl(out,ids[0]);r.rr([x]);return r.build();}\n// AND banyak kontak NOT -> 1 coil, dipecah max 6 per rung (anti rung kepanjangan)\nfunction chunkNot(o,list,outBit,auxPrefix,cmt,vsink){var m='',bits=[],ch=[],i;for(i=0;i<list.length;i+=6)ch.push(list.slice(i,i+6));if(ch.length===1){return {xml:series(o,ch[0].map(function(x){return [x,true];}),outBit,cmt),n:1};}\nch.forEach(function(c,idx){var b=auxPrefix+'_'+(idx+1);bits.push(b);if(vsink)vsink.push(b);m+=series(o+idx,c.map(function(x){return [x,true];}),b,idx===0?cmt:null);});\nm+=series(o+ch.length,bits.map(function(b){return [b,false];}),outBit);return {xml:m,n:ch.length+1};}\n// Motion step Ndeso (AutoRunning): TR0=prevBit. cmd = TR0 ANDNOT confirm (bukan ANDNOT lsc - cmd\n// harus tetap ON sampai confirm sendiri jadi TRUE, biar solenoid gak drop pas posisi baru kesentuh\n// dikit; ini persis idiom project asli Autorun.cxr sekali step-mode overlay-nya dibuang).\n// confirm = TR0 AND (sol AND lsc OR confirm). Confirm self-latch WAJIB refIn ke TR0, bukan\n// LeftPowerRail - PATTERN 4, salah ini bikin ladder salah tanpa error import.\nfunction motionStep(o,prevBit,sol,lsc,cmdBit,confirmBit,cmt){\n  var r=new Rung(o,cmt); var rail=r.rail();\n  var tr0=r.ct(prevBit,rail);\n  var cmdCoil=r.cl(cmdBit,r.ct(confirmBit,tr0,true));\n  var solLsc=r.ct(lsc,r.ct(sol,tr0));\n  var confAux=r.ct(confirmBit,tr0);\n  var confCoil=r.clm(confirmBit,[solLsc,confAux]);\n  r.rr([cmdCoil,confCoil]);\n  return r.build();\n}\n// Satu cabang blok judgement (IF-ELSE), sepasang dipakai bareng buat Y dan N:\n//   prevBit AND (kondisi OR cabang-ini) ANDNOT cabang-lawan -> cabang-ini\n// Tiga sifat yang bikin ini beda dari series() biasa:\n//   HOLD  - begitu keputusan diambil, cabangnya nyangkut lewat seal. Tanpa ini, kondisi yang kedip\n//           (sensor mantul, benda bergetar) bikin cabang lepas di tengah jalan dan langkah sesudahnya\n//           ikut mati.\n//   MUTEX - ANDNOT cabang lawan, jadi Y dan N MUSTAHIL nyala barengan sekali salah satu ngunci.\n//   RESET - seal-nya seri di belakang prevBit, jadi pas step sebelumnya drop (cycle kelar/di-stop)\n//           dua-duanya lepas sendiri, gak perlu rung reset terpisah.\n// Seal-nya WAJIB refIn ke titik SETELAH prevBit (tr0), bukan ke LeftPowerRail - PATTERN 4, sama\n// kayak confirm di motionStep(); salah di sini bikin cabang nyangkut selamanya tanpa error import.\nfunction judgeBranch(o,prevBit,condBit,condNeg,bit,otherBit,cmt){\n  var r=new Rung(o,cmt); var rail=r.rail();\n  var tr0=r.ct(prevBit,rail);\n  var trig=r.ct(condBit,tr0,condNeg);\n  var seal=r.ct(bit,tr0);\n  var gate=r.ctm(otherBit,[trig,seal],true);\n  var coil=r.cl(bit,gate);\n  r.rr([coil]);\n  return r.build();\n}\nfunction vr(n,t,d){return '<Variable name=\"'+n+'\"><Documentation xsi:type=\"SimpleText\">'+esc(d||'')+'</Documentation><Type><TypeName>'+(t||'BOOL')+'</TypeName></Type></Variable>';}\nfunction sect(n,o,rungs){return '<BodyContent xsi:type=\"smcext:LdSection\" name=\"'+esc(n)+'\" evaluationOrder=\"'+o+'\">'+rungs.join('')+'</BodyContent>';}\nfunction prog(name,ext,priv,sections,glob){\nreturn '<?xml version=\"1.0\"?>\\n<Project xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\\n         xmlns:smcext=\"https://www.ia.omron.com/Smc\"\\n         xsi:schemaLocation=\"https://www.ia.omron.com/Smc IEC61131_10_Ed1_0_SmcExt1_0_Spc1_0.xsd\"\\n         schemaVersion=\"1\"\\n         xmlns=\"www.iec.ch/public/TC65SC65BWG7TF10\">\\n  <FileHeader companyName=\"PT. Ndeso Indonesia\" productName=\"Susmax Studio\" productVersion=\"1.30.0.0\" />\\n  <ContentHeader name=\"'+name+'\" creationDateTime=\"2026-07-30T00:00:00\">\\n    <AddData><Data name=\"https://www.ia.omron.com/Smc IEC61131_10_Ed1_0_SmcExt1_0_Spc1_0.xsd\" handleUnknown=\"discard\"><smcext:DeviceInfo modelName=\"NX1P2\" version=\"1.40\" /></Data></AddData>\\n  </ContentHeader>\\n  <Types><GlobalNamespace><Program name=\"'+name+'\">\\n    <ExternalVars>\\n'+ext.join('\\n')+'\\n    </ExternalVars>\\n    <Vars accessSpecifier=\"private\">\\n'+priv.join('\\n')+'\\n    </Vars>\\n    <MainBody>\\n'+sections.join('\\n')+'\\n    </MainBody>\\n  </Program></GlobalNamespace></Types>\\n  <Instances><Configuration name=\"CE_Feeder_Machine\"><Resource name=\"MainResource\" resourceTypeName=\"\">\\n    <GlobalVars>\\n'+glob.join('\\n')+'\\n    </GlobalVars>\\n  </Resource></Configuration></Instances>\\n</Project>\\n';}\n\n// ===== TON timer rung (Block typeName=TON + instanceName, Q -> coil) =====\nfunction ton(o,gate,preset,tmrInst,doneBit,cmt,alwaysOn){\n  var r=new Rung(o,cmt); var rail=r.rail(); var inId;\n  if(gate) inId=r.ct(gate[0],rail,gate[1]); else inId=r.ct(alwaysOn||'GSB000',rail);\n  var ptId=r.n++; r.a.push('<FbdObject xsi:type=\"DataSource\" identifier=\"'+preset+'\"><ConnectionPointOut connectionPointOutId=\"'+ptId+'\" /></FbdObject>');\n  var qId=r.n++;\n  var AD=function(tag,ord){return '<AddData><Data name=\"https://www.ia.omron.com/Smc IEC61131_10_Ed1_0_SmcExt1_0_Spc1_0.xsd\" handleUnknown=\"discard\"><smcext:'+tag+' order=\"'+ord+'\" /></Data></AddData>';};\n  r.a.push('<FbdObject xsi:type=\"Block\" typeName=\"TON\" instanceName=\"'+tmrInst+'\">'\n   +'<InputVariables>'\n   +'<InputVariable parameterName=\"In\"><ConnectionPointIn>'+AD('ConnectionPointInOrder',1)+'<Connection refConnectionPointOutId=\"'+inId+'\" /></ConnectionPointIn></InputVariable>'\n   +'<InputVariable parameterName=\"PT\"><ConnectionPointIn>'+AD('ConnectionPointInOrder',2)+'<Connection refConnectionPointOutId=\"'+ptId+'\" /></ConnectionPointIn></InputVariable>'\n   +'</InputVariables>'\n   +'<OutputVariables>'\n   +'<OutputVariable parameterName=\"Q\"><ConnectionPointOut connectionPointOutId=\"'+qId+'\">'+AD('ConnectionPointOutOrder',1)+'</ConnectionPointOut></OutputVariable>'\n   +'</OutputVariables></FbdObject>');\n  var coilId=r.cl(doneBit,qId);\n  r.rr([coilId]);\n  return r.build();\n}\n\n// alamat -> nama variable port. \"0.00\"->CH000_00 ; \"CH000_00\" dibiarkan\nfunction portName(addr){\n  var a=String(addr||'').trim();\n  if(/^[A-Za-z]/.test(a)) return a.replace(/\\./g,'_');\n  var m=a.match(/^(\\d+)\\.(\\d+)$/);\n  if(m) return 'CH'+('000'+m[1]).slice(-3)+'_'+('00'+m[2]).slice(-2);\n  return 'CH'+a.replace(/\\./g,'_');\n}\n\n// ===== TON menempel di rung yang sudah ada: inId (atau [inId,...] untuk OR-merge langsung di pin In) -> TON -> coil doneBit =====\nRung.prototype.ton=function(inId,preset,inst,doneBit){\n  var ptId=this.n++;\n  this.a.push('<FbdObject xsi:type=\"DataSource\" identifier=\"'+preset+'\"><ConnectionPointOut connectionPointOutId=\"'+ptId+'\" /></FbdObject>');\n  var qId=this.n++;\n  var AD=function(tag,ord){return '<AddData><Data name=\"https://www.ia.omron.com/Smc IEC61131_10_Ed1_0_SmcExt1_0_Spc1_0.xsd\" handleUnknown=\"discard\"><smcext:'+tag+' order=\"'+ord+'\" /></Data></AddData>';};\n  var ins=Array.isArray(inId)?inId:[inId];\n  var inConns=ins.map(function(x){return '<Connection refConnectionPointOutId=\"'+x+'\" />';}).join('');\n  this.a.push('<FbdObject xsi:type=\"Block\" typeName=\"TON\" instanceName=\"'+inst+'\">'\n   +'<InputVariables>'\n   +'<InputVariable parameterName=\"In\"><ConnectionPointIn>'+AD('ConnectionPointInOrder',1)+inConns+'</ConnectionPointIn></InputVariable>'\n   +'<InputVariable parameterName=\"PT\"><ConnectionPointIn>'+AD('ConnectionPointInOrder',2)+'<Connection refConnectionPointOutId=\"'+ptId+'\" /></ConnectionPointIn></InputVariable>'\n   +'</InputVariables>'\n   +'<OutputVariables>'\n   +'<OutputVariable parameterName=\"Q\"><ConnectionPointOut connectionPointOutId=\"'+qId+'\">'+AD('ConnectionPointOutOrder',1)+'</ConnectionPointOut></OutputVariable>'\n   +'</OutputVariables></FbdObject>');\n  return this.cl(doneBit,qId);\n};\n\n// ===== Generate program XML per station + main, jumlah unit dinamis =====\nvar groups   = flow.get(\"groups\") || {};\nvar PER_PAGE;   // aktuator per screen HMI - disetel di blok \"Peta alamat HMI\" di bawah\nvar files = [], warnings = [], lscAudit = [];\n\n// ===== Warning terstruktur =====\n// warnings[] (string) tetap dipertahankan - itu yang dipakai panel warning lama dan gampang dibaca\n// manusia. Tapi string doang gak cukup buat konsumen mesin: mau ngelompokin per station, mau\n// nyaring per jenis, atau (nanti) mau LLM yang mutusin gimana nanganin tiap masalah - semuanya\n// butuh KODE yang stabil, bukan nebak dari teks bahasa Indonesia/Inggris yang bisa berubah kapan aja.\n// W() nulis ke dua-duanya sekaligus, jadi gak ada jalur yang kelewat.\n//   level : \"warn\" (default) | \"info\"\n//   code  : slug stabil, JANGAN diubah sembarangan - konsumen luar nyantol ke sini\nvar warnList = [];\nfunction W(code, station, message, extra){\n    var w = { level: (extra && extra.level) || \"warn\", code: code, station: station || \"\", message: message };\n    if(extra && extra.device) w.device = extra.device;\n    warnList.push(w);\n    warnings.push(message);\n    return w;\n}\nvar GLOBALS = {};\n// Timer default (debounce PH/PX, motion-fault) bisa disetel lewat web UI - format harus \"T#<angka><unit>\"\n// (MS/S/M/H), soalnya nilainya ditempel LANGSUNG jadi XML attribute tanpa escape (lihat lib.js ton()) -\n// input sembarangan bisa ngerusak XML, jadi divalidasi ketat, salah format jatuh ke default + warning.\nvar timerDefaults = flow.get(\"timerDefaults\") || {};\nfunction validTimer(v, fallback, label){\n    v=(v||\"\").trim();\n    if(!v) return fallback;\n    if(!/^T#\\d+(\\.\\d+)?(MS|S|M|H)$/i.test(v)){ W(\"timer_format\",\"\",'Timer default '+label+' \"'+v+'\" invalid format (expected e.g. T#200MS), using default '+fallback+'.'); return fallback; }\n    return v.toUpperCase();\n}\nvar T_PHPX   = validTimer(timerDefaults.phpx, \"T#200MS\", \"PH/PX debounce\");\nvar T_MOTION = validTimer(timerDefaults.motion, \"T#5S\", \"motion fault\");\nvar ARRAY_ELEMENTS = {}; // \"AL[61]\" -> comment, buat baris per elemen di GlobalVariables.tsv\n\n// Nama status global mengikuti standar Ndeso (MSTR_RDY, bukan MSTR_READY)\nvar MAIN_EXPORTS = [\"PWR_ON\",\"PLC_GOOD\",\"AUTO_MODE\",\"IND_MODE\",\"NO_FAULT\",\"HOME_POST\",\"AUTO_RUN\",\"CYCLE_STOP\",\"MSTR_RDY\"];\n\nfunction stripAS(n){ return n.replace(/^AS_/,\"\"); }\nfunction pad(n,w){ return (\"0000\"+n).slice(-w); }\n// Token komen buat matching sensor. Dipecah per KATA (spasi) doang, tanda baca di dalam kata dibuang tapi\n// angkanya tetap nempel ke kata induknya: \"STOPPER-2\" -> \"STOPPER2\", bukan [\"STOPPER\",\"2\"]. Dua alasan:\n//  1. angka itu satu-satunya pembeda antar unit sejenis (STOPPER-2 vs STOPPER-5, POSITION-1 vs POSITION-2).\n//     Dulu kepecah lalu kebuang filter length>2, semua kandidat seri skor dan yang menang cuma yang paling\n//     awal di daftar I/O - salah sambung tanpa warning.\n//  2. kalau angkanya jadi token lepas, \"TYPE-2\"/\"FEEDER-2\" ikut nyantol ke \"STOPPER-2\" cuma gara-gara\n//     sama-sama punya \"2\" - cukup buat nembus ambang skor>=2 padahal gak ada hubungannya.\n// Gak ada filter panjang: kata arah 2 huruf (UP, DN, IN) justru sering jadi satu-satunya pembeda.\n// Aturan pecah katanya sengaja sama persis sama buildName() di genname.js biar konsisten sama penamaan.\nfunction cmtTokens(d){ return (d.komen||\"\").toUpperCase().split(/\\s+/).map(function(w){ return w.replace(/[^A-Z0-9]/g,\"\"); }).filter(Boolean); }\nfunction cmtScore(x,y){ var a1=cmtTokens(x),b1=cmtTokens(y),m=0; a1.forEach(function(w){ if(b1.indexOf(w)>=0) m++; }); return m; }\n// Stem nama tanpa prefix jenis. genname.js nurunin nama dari komen doang (prefix cuma ikut jenis), jadi\n// sensor dan aktuator dari komen yang sama pasti sestem: SOL_ST1_STP2_CHK <-> AS_ST1_STP2_CHK.\n// CR ikut dilucuti: aktuator gak selalu jenis SOL, solList emang nerima CR juga (mis. ST2 STOPPER-1 UP).\nfunction nameStem(n){ return (n||\"\").replace(/^(?:SOL|SRV|AS|LSC|LS|CR)_/,\"\"); }\n\n// Cari LSC (limit switch combination) buat device (dipakai buat motion fault dan AutoRunning).\n// Exact stem match duluan (deterministik), fuzzy komen cuma fallback kalau penamaannya beda.\nfunction findLsc(dev,asPairs){\n    var target=nameStem(dev.name), exact=null;\n    asPairs.forEach(function(p){\n        p.forEach(function(asDev){\n            if(!exact && nameStem(asDev.name)===target) exact=\"LSC_\"+stripAS(asDev.name);\n        });\n    });\n    if(exact){ lscAudit.push(dev.komen+\" -> \"+exact+\" (exact name stem)\"); return exact; }\n\n    var best=null,bestScore=0,tied=[];\n    asPairs.forEach(function(p){\n        p.forEach(function(asDev){\n            var s=cmtScore(dev,asDev), nm=\"LSC_\"+stripAS(asDev.name);\n            if(s<2) return;\n            if(s>bestScore){ bestScore=s; best=nm; tied=[nm]; }\n            else if(s===bestScore && tied.indexOf(nm)<0){ tied.push(nm); }\n        });\n    });\n    if(best){\n        lscAudit.push(dev.komen+\" -> \"+best+\" (score \"+bestScore+\")\");\n        // Seri skor = matcher gak punya dasar buat milih, cuma kepilih gara-gara urutan I/O. Ini yang dulu\n        // bikin STOPPER-2/3/4 semua nyantol ke sensor STOPPER-5 tanpa satupun warning keluar.\n        if(tied.length>1) W(\"lsc_ambiguous\",\"\",'LSC match for \"'+dev.komen+'\" is AMBIGUOUS: '+tied.length+' candidates tied at score '+bestScore+' ('+tied.join(\", \")+'), picked \"'+best+'\" by I/O order only - verify manually.',{device:dev.name});\n        else if(bestScore===2) W(\"lsc_low_confidence\",\"\",'LSC match for \"'+dev.komen+'\" -> \"'+best+'\" is low-confidence (score 2, only 2 shared comment words) - verify manually.',{device:dev.name});\n    }\n    return best;\n}\nfunction pairUp(l){ var p=[]; for(var i=0;i<l.length;i+=2){ if(l[i+1]) p.push([l[i],l[i+1]]); } return p; }\n// Nama device buat teks alarm: ambil kata-kata AWAL yang sama dari dua komen pasangan\n// (\"ST1 STOPPER-5 CHUCK\" + \"ST1 STOPPER-5 UNCHUCK\" -> \"ST1 STOPPER-5\"). Dipotong per KATA,\n// bukan per karakter, kalau tidak \"CLAMP\" vs \"CLAMP2\" kepotong di tengah kata jadi nama palsu.\n// Spasi ganda di komen sumber (\"ST2  STOPPER-1\") sekalian dirapikan jadi satu spasi.\nfunction words(s){ return String(s||\"\").trim().split(/\\s+/).filter(Boolean); }\nfunction devBase(a,b){\n    var wa=words(a), wb=words(b), i=0;\n    while(i<wa.length && i<wb.length && wa[i]===wb[i]) i++;\n    return (i?wa.slice(0,i):wa).join(\" \");\n}\n// Komen elemen AL/MF selalu diawali stub bernomor (AL071_, MF007_) - gaya yang sama dengan baris\n// Spare di fillSpareArrayComments(), biar satu tabel Global Variable seragam dan slot kepakai /\n// cadangan sama-sama kebaca nomornya tanpa lihat kolom Name. Komen rung TIDAK pakai stub ini.\nfunction AL(n,cmt){ var t=\"AL[\"+n+\"]\"; if(cmt) ARRAY_ELEMENTS[t]=\"AL\"+pad(n,3)+\"_ \"+cmt; return t; }\nfunction MF(n,cmt){ var t=\"MF[\"+n+\"]\"; if(cmt) ARRAY_ELEMENTS[t]=\"MF\"+pad(n,3)+\"_ \"+cmt; return t; }\n// Nama station custom (opsional, disetel di panel \"Pengaturan\" web UI) - dipakein ke SEMUA komen yang\n// nyebut identitas station (bukan cuma LB400_A/B), termasuk broadcast status lintas-program (MAIN dan\n// station lain), biar konsisten satu ladder gak setengah-setengah ada nama setengah cuma \"ST1\".\nvar stationNamesMap = flow.get(\"stationNames\") || {};\nfunction labelOf(k){ var n=(stationNamesMap[k]||\"\").trim(); return k+(n?(\" \"+n):\"\"); }\n// Susmax Program name gak boleh ada spasi (ganti underscore), cuma alfanumerik+underscore aman -\n// dipakai buat akhiran nama Program/ContentHeader DAN nama file download-nya (Prg010_ST1_ConveyorFeed).\nfunction sanitizeIdent(s){ return (s||\"\").trim().replace(/[^A-Za-z0-9]+/g,\"_\").replace(/^_+|_+$/g,\"\"); }\n\n// urutan station dinamis: apa saja yang muncul di komen\nvar ukeys = Object.keys(groups).filter(function(k){ return k!==\"MAIN\" && groups[k].length; })\n                  .sort(function(a,b){ return parseInt(a.replace(/\\D/g,\"\"),10)-parseInt(b.replace(/\\D/g,\"\"),10); });\nvar STMAP = {};\nukeys.forEach(function(k,i){\n    var n = parseInt(k.replace(/\\D/g,\"\"),10) || (i+1);\n    var nameSuffix = sanitizeIdent(stationNamesMap[k]);\n    STMAP[k] = { prg:\"Prg\"+pad(10+i,3)+\"_\"+k+(nameSuffix?(\"_\"+nameSuffix):\"\"), gb:\"GB\"+pad(10+i,3), n:n };\n});\n\n// AL/MF: index 1..AL_MAIN_RESERVED buat alarm MAIN, sisanya blok per station UKURAN DINAMIS\n// (persis sebesar jumlah AS-pair / actuator-pair station itu sendiri) - bukan lebar tetap, biar\n// station dengan banyak actuator gak kehabisan slot dan station kecil gak buang-buang array.\nvar AL_MAIN_RESERVED = 10;\nvar AL_BLOCK = {}, MF_BLOCK = {};\n// *_USED = slot yang DIALOKASI (termasuk padding spare) - ini batas minimum ukuran array.\n// *_FILLED = slot yang beneran keisi alarm/fault - cuma buat rekomendasi di web UI.\nvar AL_SIZE, MF_SIZE, AL_USED = 0, MF_USED = 0, AL_FILLED = 0, MF_FILLED = 0, STATION_BLOCK = 30;\n// Tiap station dapat blok BERUKURAN TETAP, dipadding spare sampai segini. Sebelumnya blok dipas-pasin\n// ke jumlah aktuator, jadi nambah satu silinder di ST1 nggeser nomor AL/MF SEMUA station sesudahnya -\n// komen yang sudah dilengkapi orang di Susmax Studio jadi nunjuk alarm yang salah. Dengan blok tetap,\n// nomor per station stabil dan tiap station punya ruang tumbuh sendiri.\nvar STATION_BLOCK_DEFAULT = 30;\n(function computeArrayBlocks(){\n    var sb = parseInt((flow.get(\"arraySizes\")||{}).stationBlock, 10);\n    if(!isFinite(sb) || sb <= 0) sb = STATION_BLOCK_DEFAULT;\n    // --- 1. hitung kebutuhan tiap station dulu, belum bagi-bagi nomor ---\n    var need = {};\n    ukeys.forEach(function(k){\n        var devs = groups[k];\n        var asCount = pairUp(devs.filter(function(d){return d.jenis===\"AS\";}).sort(function(a,b){return a.row-b.row;})).length;\n        // servo SRV_CMD itu mandiri (1 MF slot per command, gak dipair) - beda dari actus yang 1 pair = 1 slot\n        var actCount = pairUp(devs.filter(function(d){return d.io===\"OUT\" && (d.jenis===\"CR\"||d.jenis===\"SOL\");})).length\n                     + devs.filter(function(d){return d.io===\"OUT\" && d.jenis===\"SRV_CMD\";}).length;\n        // Alarm yang dipasang user lewat blok \"alarm\" di flowchart AutoRunning ikut makan slot AL,\n        // jadi HARUS kehitung di sini. Kalau enggak, blok station kekecilan dan alarm flowchart-nya\n        // bakal ke-skip gara-gara \"AL alarm block full\" padahal array-nya masih bisa digedein.\n        var alarmCount = 0;\n        (((flow.get(\"motionSequences\")||{})[k])||[]).forEach(function(v){\n            ((v&&v.nodes)||[]).forEach(function(n){ if(n && n.type===\"alarm\") alarmCount++; });\n        });\n        need[k] = { al: asCount + alarmCount, mf: actCount };\n        AL_FILLED += need[k].al; MF_FILLED += need[k].mf;\n    });\n    AL_FILLED += AL_MAIN_RESERVED;\n\n    // --- 2. ukuran blok SERAGAM buat semua station ---\n    // Seragam itu syarat, bukan selera: nomor blok dihitung dari NOMOR station (lihat langkah 3), dan\n    // itu cuma mungkin kalau tiap blok sama besar. Kalau ada satu station yang butuhnya lebih dari\n    // setelan, SEMUA blok dinaikin - bukan cuma station itu - biar rumusnya tetap berlaku.\n    var maxNeed = 0;\n    ukeys.forEach(function(k){ maxNeed = Math.max(maxNeed, need[k].al, need[k].mf); });\n    if(maxNeed > sb){\n        W(\"station_block_raised\",\"\",\"A station needs \"+maxNeed+\" slots, more than 'Slots per station' (\"+sb+\") - raised to \"+maxNeed+\n                      \" for EVERY station so the numbering stays uniform. Raise the setting if you want spare room again.\");\n        sb = maxNeed;\n    }\n    STATION_BLOCK = sb;\n\n    // --- 3. nomor blok dari NOMOR station, BUKAN urutan kemunculan ---\n    // ukeys cuma memuat station yang PUNYA device. Dulu blok dibagi berurutan dari daftar itu, jadi\n    // kalau ST2 belum ada isinya, ST3 makai jatah ST2 - dan begitu ST2 diisi, semua nomor ST3 geser.\n    // Sekarang ST3 selalu blok ke-3 apa pun isi ST1/ST2: nambah unit baru atau ngosongin unit lama\n    // gak nggeser nomor station manapun. Ongkosnya cuma slot bolong kalau penomoran station lompat.\n    var idxOf = {}, maxIdx = 0;\n    ukeys.forEach(function(k){\n        var m = /(\\d+)/.exec(k);\n        if(m){ idxOf[k] = parseInt(m[1], 10); maxIdx = Math.max(maxIdx, idxOf[k]); }\n    });\n    var extra = maxIdx;   // station tanpa angka di namanya ditaruh sesudah yang bernomor\n    ukeys.forEach(function(k){ if(idxOf[k] === undefined){ idxOf[k] = ++extra; maxIdx = extra; } });\n\n    ukeys.forEach(function(k){\n        var i = idxOf[k] - 1;\n        AL_BLOCK[k] = { start: AL_MAIN_RESERVED + i*sb + 1, end: AL_MAIN_RESERVED + (i+1)*sb };\n        MF_BLOCK[k] = { start: i*sb + 1,                     end: (i+1)*sb };\n    });\n    // Panjang array ngikut nomor station TERTINGGI, bukan jumlah station - ST1 dan ST5 doang tetap\n    // bikin array sepanjang 5 blok, karena ST5 memang nempatin blok ke-5.\n    AL_USED = AL_MAIN_RESERVED + maxIdx*sb;\n    MF_USED = maxIdx*sb;\n    // Ukuran array boleh disetel user lewat panel \"Ukuran array\" di web UI. Tapi TIDAK PERNAH boleh\n    // turun di bawah yang beneran kepakai - kalau dipaksa, alarm/motion-fault paling belakang bakal\n    // nunjuk index di luar array dan itu error pas import, bukan sekadar kurang rapi. Jadi angkanya\n    // dinaikin balik + warning, bukan diam-diam ngedrop slot.\n    var want = flow.get(\"arraySizes\") || {};\n    function pickSize(raw, dflt, used, name){\n        var v = parseInt(raw, 10);\n        if(!isFinite(v) || v <= 0) return Math.max(dflt, used);\n        if(v < used){\n            W(\"array_size_raised\",\"\",\"Array \"+name+\" was asked for \"+v+\" elements but \"+used+\" slots are already in use - raised to \"+used+\".\");\n            return used;\n        }\n        return v;\n    }\n    AL_SIZE = pickSize(want.al, 100, AL_USED, \"AL\");\n    MF_SIZE = pickSize(want.mf, 16, MF_USED, \"MF\");\n})();\nvar AL_TYPE = \"ARRAY[1..\"+AL_SIZE+\"] OF BOOL\";\nvar MF_TYPE = \"ARRAY[1..\"+MF_SIZE+\"] OF BOOL\";\n\n// ============================================================ PETA ALAMAT HMI\n// NX dan NB cuma bisa ngobrol lewat ALAMAT MEMORI, bukan tag/network variable - driver di project\n// HMI-nya \"OMRON CJ/CS/NJ Series Ethernet UDP\" (FINS). Jadi tiap simbol yang disentuh HMI wajib\n// punya AT specification ke area CJ-series Unit memory, dan kolom AT di GlobalVariables.tsv itu\n// SATU-SATUNYA penyambung antara dua sisi. Simbol tanpa AT = tombol yang gak nyambung ke mana-mana.\n//\n// Skema word-nya bukan karangan: dibaca balik dari project HMI produksi (Prepare HMI CE INSERT),\n// dari unit 1, 2, 6, 7, 8 yang alamatnya masih bersih:\n//\n//   tombol station n (HMI -> PLC, \"Write\" di switch NB) : W(PB_BASE + n*STRIDE)\n//   lampu  station n (PLC -> HMI, \"Read\"  di switch NB) : word tombol + RD_OFFSET   <- selalu +23\n//   bit di dalam word : tiap slot grid 2 bit (M lalu R), page 1 isi .00-.07, page 2 .08-.15\n//\n// Unit 3/4/5 di project itu JANGAN dicontoh: tiga screen (0431, 0441, 0451) nulis W465 bit per bit\n// sama persis, jadi tombol di screen unit 4 dan 5 menggerakkan aktuator unit 3. Yang dipakai di\n// sini formula bersihnya, dan hmiClaim() di bawah nolak dua simbol berbagi satu alamat - persis\n// jenis kesalahan yang bikin project itu rusak diam-diam.\nvar HMI_AT = {};     // nama simbol -> string AT (\"W461.00\"), dipakai kolom AT di TSV\nvar HMI_ROWS = [];   // baris peta buat panel HMI di web UI\nvar HMI_OWNER = {};  // string AT -> nama simbol yang sudah nempatin, buat deteksi tabrakan\nvar HMI_CFG = (function(){\n    var c = flow.get(\"hmiMap\") || {};\n    function num(v, dflt, label, min, max){\n        if(v === undefined || v === null || v === \"\") return dflt;\n        var n = parseInt(v, 10);\n        if(!isFinite(n) || n < min || n > max){\n            W(\"hmi_cfg_range\",\"\",\"HMI map: \"+label+' = \"'+v+'\" is outside '+min+\"..\"+max+\", using default \"+dflt+\".\");\n            return dflt;\n        }\n        return n;\n    }\n    // Area memori dipisah per blok: tombol/lampu di W (itu yang dipakai screen NB), AL/MF di H\n    // (bit retentif - alarm gak boleh hilang pas power cycle). Cuma area CJ-series Unit memory\n    // yang boleh, karena cuma itu yang kejangkau FINS dari NB.\n    function area(v, dflt, label){\n        var a = String(v||\"\").trim().toUpperCase();\n        if(!a) return dflt;\n        if([\"W\",\"H\",\"D\",\"CIO\"].indexOf(a) < 0){\n            W(\"hmi_cfg_range\",\"\",\"HMI map: \"+label+' area = \"'+v+'\" is not W/H/D/CIO, using default '+dflt+\".\");\n            return dflt;\n        }\n        return a;\n    }\n    return {\n        on      : c.enabl
